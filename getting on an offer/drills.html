<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setter Drills</title>
<style>
:root{--bg:#f6f5f2;--card:#ffffff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--accent:#2f5bd3;--good:#1f8a4c;--bad:#b3261e;--chip:#eeece7;--warn:#9a6700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--ink:#f1f1f3;--muted:#a0a0a8;--line:#2c2c31;--accent:#7c9bff;--good:#4cc27e;--bad:#ff7a70;--chip:#26262b;--warn:#e3b341}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--ink:#f1f1f3;--muted:#a0a0a8;--line:#2c2c31;--accent:#7c9bff;--good:#4cc27e;--bad:#ff7a70;--chip:#26262b;--warn:#e3b341}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:700px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:19px;margin:0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tab{flex:1;min-width:140px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:14px}
.tab b{display:block;font-size:14px}
.tab span{font-size:12px;color:var(--muted)}
.tab.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:280px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stage{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.src{font-size:12px;color:var(--muted)}
.ctx{font-size:13px;color:var(--muted);margin:6px 0 12px}
.line{font-size:21px;line-height:1.35;font-weight:600;margin:6px 0 14px}
.say{font-size:14px;color:var(--muted);margin-bottom:10px}
.ans{display:none;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.ans.show{display:block}
.ans h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px;color:var(--good)}
.ans h3.no{color:var(--bad)}
.ans p{margin:4px 0 8px}
.why{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button.b{flex:1;min-width:110px;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink)}
button.p{background:var(--accent);color:#fff}
button.g{background:var(--good);color:#fff}
button.r{background:var(--bad);color:#fff}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--good);width:0}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:4px 0 10px}
.tog,.small{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.small.on{border-color:var(--warn);color:var(--warn)}
.result h2{margin:0 0 6px;font-size:22px}
.result li{margin:6px 0}
footer{margin-top:16px;font-size:12px;color:var(--muted)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Setter Drills</h1><div class="muted" id="count"></div></div>
  <button class="tog" id="theme" aria-label="Toggle theme">◐ Theme</button>
</header>
<div class="row" id="decks"></div>
<div class="row" id="chips"></div>
<div class="tools">
  <div class="muted" id="score"></div>
  <div style="display:flex;gap:6px">
    <button class="small" id="exam">20-card check</button>
    <button class="small" id="reset">Reset progress</button>
  </div>
</div>
<div class="bar"><i id="prog"></i></div>
<div class="card" id="card"></div>
<footer>Say every answer <b>out loud</b> before you reveal. Keys: <kbd>Space</kbd> reveal · <kbd>1</kbd> nailed it · <kbd>2</kbd> again · <kbd>→</kbd> skip. Progress is saved in this browser only. Built from Scott's course, the Syndicate call, Atefur #1–5, your Kevin roleplays, and the 150 calls in the repo.</footer>
</div>
<script>
const DECKS=[[["Openers", "OPEN", "They booked a 3pm slot (triage).", "(phone rings) Hello?", ["Hey Marcus, how you doing, man? It's Stefan from Ray's team. I've got you down for 3 about trading. What got you booking in?"], "Heeey… is this Marcus? Are you free for a quick 5 to 10 minute chat?", "Scott: familiar tone, context, one open question. No permission, no farming yeses.", "core"], ["Openers", "OPEN", "New form, filled out 3 minutes ago.", "Yeah, who's this?", ["Hey, it's Stefan from Ray's team. You literally just put your info in about trading. What made you fill it out?"], "So, um, like, I guess, I'm calling because you, like, filled a form?", "Speed to lead. The reason they filled it in is still fresh, so ask for it.", "core"], ["Openers", "OPEN", "Downloaded a free guide 4 days ago.", "Uh, maybe? I download a lot of stuff.", ["Ha, fair, you're not the only one. Just so I don't waste your time, is trading something you're actually looking to get into, or more just having a look around right now?"], "Oh, okay, well, can I tell you about our program?", "Scott's binary is on purpose here. It makes a cold lead pick a side.", "core"], ["Openers", "OPEN", "Old lead from 6 months ago.", "Who is this?", ["Hey, it's Stefan from Leo's team. Bit of a random one: you reached out back in May about starting a store and never got a proper call. Where are you at with it now?"], "Hi, we're following up on your interest in our services.", "Admitting it's random lowers the guard on an old lead.", "core"], ["Openers", "OPEN", "Registered for the webinar, didn't show.", "Oh no, I didn't watch it, sorry.", ["Ha, don't be sorry, half the people who sign up don't make it. What happened Tuesday?"], "Okay, well, you missed a lot of valuable information.", "Take the guilt away. 'What happened?' is an easy question, and it's often where the pain is.", "core"], ["Openers", "OPEN", "He calls back a missed call.", "Somebody called me from this number?", ["Hey, yeah, that was me, thanks for calling back. It's Stefan from Ray Thompson's team, the trading guy. You filled out an application yesterday. Ring a bell?"], "Who's this?", "Callbacks start confused. Give your name, the owner's full name, what they filled out and when.", "core"], ["Openers", "OPEN", "Paying member of the $99/month academy.", "Hey, yeah, who's this?", ["Hey Sam, it's Stefan from Luke's team. You joined the Academy about three weeks ago, so I'm doing your welcome call. How are you finding it so far?"], "Hi! I'm calling to tell you about our premium program.", "Onboard first. They've paid, so they trust you. Find the gap before any upgrade.", "core"], ["Vague", "CURRENT", "Intent question just asked.", "I just want to make more money.", ["Sure. What are you making right now, roughly?", "…And how much would you need for this to be worth it? … What would that actually change for you?"], "Why do you want more money? … But why? … Okay, but why though?", "Scott: change the angle, don't repeat 'why'. Current income, then target, then what it changes.", "core"], ["Vague", "CURRENT", "After asking what's going on.", "Everyone wants more money, right?", ["Not everyone's filling out forms about it at 11pm. (laugh) What's specifically going on for you?"], "Haha, yeah, true.", "Scott's 'not everyone' move, done lightly.", "core"], ["Vague", "CURRENT", "Trading offer. You asked how the job is.", "It's boring. Repetitive.", ["Honestly, trading's repetitive too. Same charts every morning, a lot of days nothing happens. So knowing that, why do you actually want to change?"], "How so? … How come? … Any examples?", "Scott's reframe takes 'boring' away. Now it has to be money, freedom or something real.", "core"], ["Vague", "CURRENT", "You asked what's going on at work.", "It's fine.", ["(two seconds of silence)", "…Fine?"], "Okay, cool. So what's your goal?", "Silence gets more than another question. Repeat their one word as a question (Atefur).", "core"], ["Vague", "GOAL", "You asked about their goal.", "I don't know.", ["If you had to guess?"], "Would it be more like freedom, or more like money, or…?", "Don't hand them options (Scott). Let them guess.", "core"], ["Vague", "CURRENT", "He keeps saying freedom.", "I just want freedom.", ["Freedom from what?", "What would that look like, day to day?"], "Freedom's great! So, how long have you been looking at trading?", "Turn the vague word into something concrete.", "core"], ["Vague", "WHY NOW", "You asked what made them reach out now.", "I just saw the ad.", ["Fair. And how long have you felt like [their word] about the job?", "…So what's different now, compared to then?"], "Did anything happen recently?", "Don't fish for a trigger. Pin the timeframe, then ask what's different now.", "core"], ["Vague", "WHY NOW", "He said 'just now' when you asked when he decided.", "Just now, I guess.", ["When's 'just now'? … How long ago was that? … What shifted for you when you saw it?"], "Okay. So, the money side…", "Atefur #5: pin the vague 'why now' down step by step.", "core"], ["Vague", "CURRENT", "He says the job's going nowhere.", "I'm still young, I want to see the world.", ["What do you mean when you say you're still young?"], "That's great, travelling is amazing!", "Scott: follow each new word once.", "core"], ["Vague", "URGENCY", "Temp check.", "Like a 5, I guess.", ["How come only a 5?", "…Is this something you actually want to change now, or something you'll keep pushing down the road?"], "Okay, 5 is good! So let's book you in.", "6 or below: ask why, then challenge with a binary. Disqualify, or get a real number.", "core"], ["Vague", "URGENCY", "After the challenge, he still doesn't care.", "Honestly, I'm fine where I am.", ["Is that what you're willing to settle for?", "(if yes) Then honestly, I don't think booking you in makes sense. If that changes, give me a shout."], "But don't you want more for your family?!", "Scott: no boxing match. They have to want it. An interest DQ is a fine outcome.", "core"], ["Habits", "CURRENT", "They just said: 'Every video says something different, I don't know what to do.'", "(You're about to sum it up.)", ["What do you think it'd take for you to actually get there?"], "So you're more after the guidance, right?", "Your habit #1. Make them say it. You get no points for knowing it.", "core"], ["Habits", "CURRENT", "They said: 'I missed my best friend's wedding abroad.'", "…so yeah, the business can't run without me.", ["You missed your best friend's wedding. How did that feel?", "(silence)"], "Okay. And with trading you'd have that freedom, right?", "Your habit #3. That was the North Star, and you walked past it (K4 19:02). Slow down.", "core"], ["Habits", "CURRENT", "You want to know how they feel about the job.", "(You're about to ask.)", ["How do you feel about the job?", "(stop and wait)"], "Do you like it? Do you hate it?", "Your habit #2. No options in discovery. Ask, then stop.", "core"], ["Habits", "MONEY", "Kevin asks: 'So how much does the mentorship cost?'", "How much does it usually cost?", ["Honestly, it depends on what you need, and I don't know that yet. That's exactly what Jack's call is for. He'll go through all of it."], "Anywhere from three to seven grand.", "Your habit #5 (K6 26:53). Never quote a price on a setting call.", "core"], ["Habits", "OPEN", "You're about to ask your first question.", "(Say it clean.)", ["What got you interested in e-com in the first place?"], "So tell me, man, like, what, I guess, like, have you interested in starting to, wanting to do e-com?", "Your habit #7 (K8 18:07). Five questions, learned by heart, no 'like, I guess'.", "core"], ["Pushback", "OPEN", "First 10 seconds.", "Is this a scam? No offence.", ["None taken, honestly, that's a smart question. There's a lot of fake stuff out there. I'm not selling you anything on this call, I'm just seeing if it even makes sense for you. If it doesn't, I'll tell you straight."], "No no no, we're totally legit, we have hundreds of testimonials!", "Agree with the worry. Defending yourself makes you sound less legit.", "core"], ["Pushback", "OPEN", "First 10 seconds.", "Is this a real person? Are you a bot?", ["(laugh) Last I checked. Real guy, at a desk, with a coffee that's gone cold."], "Yes, I am a real person calling on behalf of…", "Answer with a joke and a human detail.", "core"], ["Pushback", "CURRENT", "Mid-call.", "Wait, are you reading off a script?", ["I've got notes, I'm not gonna lie, everybody does. But I'm not reading you a script. I'm actually trying to understand what's going on with you before I put you in front of someone."], "No, no, of course not!", "Honesty beats denial. Then give the reason for the questions.", "core"], ["Pushback", "OPEN", "They can't understand you.", "Sorry, I can't understand you. Where are you from?", ["(relaxed) Moldova. Next to Romania. Little country, good wine. I'll slow down, my bad. So you put an application in last night. What made you apply?"], "I'm so sorry, my English is not very good, I apologise…", "One fun fact, slow down, straight back to the question. Most of the time it's their signal.", "core"], ["Pushback", "OPEN", "First minute.", "Before anything, how much is it?", ["Straight to it, I respect that. Honestly, it depends on what you need, and I don't know that yet. That's what this call's for. If it's clearly not a fit, I'll tell you in five minutes."], "It's $5,000.", "Answer honestly, give the reason, box the time, give an exit.", "core"], ["Pushback", "CURRENT", "Second time.", "Okay but seriously, is it hundreds or thousands?", ["I can tell this is really bugging you. It's an investment, it's not a fifty-dollar course. But I don't want to throw a number at you with no context. Two more minutes, and if it's clearly not realistic, I'll say."], "Like I said, it depends.", "Name their frustration. Give a little. Box the time.", "core"], ["Pushback", "MONEY", "You asked what they make.", "Why do you need to know that?", ["Fair question. It's so I know what's realistic for you. Your goal's 2 grand a month, and I want to understand the gap from where you're at now."], "(long pause) Uh… it's just, um, part of the process.", "Give the reason, calm and short. No stutter (Atefur).", "core"], ["Pushback", "MONEY", "Second, harder pushback on money.", "That's not really your business, no offence.", ["None taken, I get it. I'm not asking for the sake of it. If you go to a personal trainer to gain muscle, the first thing he asks is what you're working with. In trading it takes money to make money. Just a rough figure. What are you taking home?"], "Okay, sorry, we can skip it.", "Don't back down, don't get defensive. Reason line, then ask again, smaller.", "core"], ["Pushback", "CURRENT", "He says he doesn't need help.", "I could build all of this myself in a weekend.", ["I believe you, you're probably more technical than most people who download it. So what had you downloading it, if you could build it?"], "Well, actually, our program has a lot more than that…", "Agree, then ask a question he can only answer with his real reason.", "core"], ["Pushback", "CURRENT", "He says he already knows how to sell.", "I've sold cars for ten years. What would you even teach me?", ["Honestly? Probably not how to sell. Ten years on a lot is harder than most of what we do. So if you already know how to sell, what made you book?"], "Well, high-ticket is different from cars…", "Give status, then flip it into his reason.", "core"], ["Pushback", "CURRENT", "Already joined something else.", "I already joined another guy's program.", ["Nice, good for you for jumping in. How's it going, five months in?"], "Oh. Well, ours is better because…", "Never trash another program. Curiosity lets them tell you the gap.", "core"], ["Pushback", "CURRENT", "Tech sales offer.", "Why would I pay to get a job? Jobs should pay me.", ["Totally fair, and some people do get in free. Can I ask: since you started applying, how many interviews have the free applications got you?"], "Because our program is an investment in your future.", "Let their own numbers answer the objection.", "core"], ["Pushback", "CURRENT", "They want info, not a call.", "Can you just email me the info?", ["For sure. Honestly though, info without knowing where you're at is just a brochure. Give me five minutes and I'll know if it's even worth sending. If not, I'll tell you."], "Sure, what's your email? (and the call ends)", "Agree, then give a reason, a time box and an exit.", "core"], ["Pushback", "MONEY", "Credit repair.", "Can you guarantee I'll be at 700?", ["Straight up: no. Nobody honest can guarantee a score. If someone does, I'd run. What I can do is get you someone who'll tell you honestly what's possible and how long."], "Most of our clients see big increases!", "A guarantee is a red flag, and it's legally risky. Honesty is how you pass the test.", "core"], ["Pushback", "CURRENT", "He asks about YOU.", "How much do you make? Have you even done this?", ["(laugh) Straight in. Enough that I'm not looking for another job. And honestly, I'm still early. The guys who've been doing this a couple of years make a lot more than me, and the closers more again."], "I make six figures.", "Don't brag, don't lie. You'll get respect for being honest.", "core"], ["Money", "MONEY", "Capital offer (trading). After urgency.", "(Start the money section.)", ["Okay, let me ask a couple of questions on the money side, so I know where you're at. What are we looking to make from trading a year from now? … And how far are we from that right now, with your current income?"], "So how much money do you have?", "Set it up, then the gap (Atefur #4).", "core"], ["Money", "MONEY", "Capital offer. Monthly savings.", "(Ask how much they can save.)", ["And you know how expenses are nowadays, the way the economy's going. How much are you actually able to put aside from that each month? … Is that a tight month, or your usual?"], "How much do you save?", "'Because' psychology: a reason before the question makes people answer.", "core"], ["Money", "MONEY", "Capital offer. Total saved, and they ask why.", "Why does that matter?", ["Yeah man, I'm sure you know in trading it takes money to make money, right? So how much would you say you've set aside in terms of capital?"], "Um, sorry, it's just a question we ask.", "Your script line. Say it like it's normal, because it is.", "core"], ["Money", "MONEY", "Program offer (high-ticket sales). No capital needed.", "(Start money without saying 'capital'.)", ["A big part of what we do is help people grow their income. If this worked, what would you want to be making a month? … And where are you at right now? … With how expensive everything is, how much are you able to put aside each month? … And in total?"], "It takes money to make money in sales, right?", "For program offers, go through income. 'Capital' sounds weird when there's no business to fund.", "core"], ["Money", "MONEY", "Program offer. Checking they can invest, without saying a price.", "(Ask if they can invest.)", ["And if [closer] finds the right fit for you, is investing in yourself something you'd be in a position to do right now, or is money genuinely tight?"], "Would you be willing to invest $5,000?", "Binary on purpose: it's a challenge. No price.", "core"], ["Money", "MONEY", "Health or dating offer.", "(Ask about money.)", ["What are you spending on the gym, supplements, all of that right now? … And what's coming in each month, roughly? … Are you able to put anything aside?"], "How much do you have saved for coaching?", "Start with what they already spend.", "core"], ["Money", "SOFT QUAL", "Student or unemployed, early in the call.", "I'm at uni. I don't really work.", ["Just so I don't waste your time, if you're looking at our coaching, it's a mid four-figure investment. Is that something that'd be viable for you right now, or is it completely out of the question?"], "Okay, so what are your goals?", "Scott's transparent line. A fast DQ, or a fast green light.", "core"], ["Money", "MONEY", "He offers his retirement money.", "I've got $400K in my 401(k), money's not a problem.", ["Frank, I appreciate you being open. But I'm going to stop you there, because I'd say this to my own dad: retirement money stays retirement money. You're 59. If anything went wrong, there's no time to rebuild it."], "Great! That's more than enough.", "Right, legally safer, and the biggest trust moment on the call.", "core"], ["Money", "MONEY", "Asking about credit.", "(Ask about credit.)", ["Some people prefer to spread things out rather than paying all at once. Have you got credit available, or would you rather keep it to savings?"], "(nervous) So, um, sorry, do you maybe have, like, credit cards?", "Atefur: don't ask it 'like a cute girl at the bar'. Fewer words, no pause.", "core"], ["Tension", "OPEN", "Old lead, angry.", "Y'all keep calling me! This is the fifth one this week!", ["Five in a week, I'd be pissed too. I'm only from Ray's team. If you want me to take you off right now, I'll do it, no problem."], "Sir, I'm just doing my job.", "Agree with the anger. Offer the exit and mean it.", "core"], ["Tension", "OPEN", "He calls back, rude.", "Who the f*** is this?", ["(calm) Hey, my bad, man. It's Stefan from Sam's team. You filled out a form yesterday about the shop's Instagram. I tried you once this morning. If now's bad, I'll leave you alone."], "Excuse me, there's no need for that language.", "Stay calm, give the context, offer to go. He'll apologise himself.", "core"], ["Tension", "CURRENT", "Her husband grabs the phone.", "Is this one of those pyramid schemes?", ["Great question, and honestly, I'm glad you're here. No, nobody recruits anybody. But don't just take my word for it. That's what the next call is for, and I'd want you on it."], "Sir, I was speaking with your wife.", "Welcome the sceptical spouse. Give him a role.", "core"], ["Tension", "CURRENT", "A couple starts arguing on speaker.", "That's for the boiler and the car—", ["Can I jump in for a sec? Honestly, you're both right. Something needs to change, and you can't risk money you need. Both are true. You don't have to solve it tonight. That's what the next call is for."], "(staying quiet and letting them argue)", "Never pick a side. Hand it to the closer.", "core"], ["Tension", "CURRENT", "She starts crying.", "Sorry, I didn't think I'd get upset.", ["(gently) Please don't apologize. Take your time. There's no rush at all."], "Oh, don't cry! It's going to be okay! So, anyway…", "Say less, not more. Let her come back.", "core"], ["Tension", "CURRENT", "Their energy is flat.", "(short, bored answers)", ["Sounds like I caught you at a busy one. You still good for five minutes, or should I call you after?"], "Are you always this excited, by the way?", "Kevin #7 29:36. Name it kindly, never sarcastically.", "core"], ["Tension", "CURRENT", "He argues for free YouTube.", "I'll just use free videos.", ["That's fair, there's a lot of good free stuff. So what's stopped the free stuff from working so far?"], "Do you think everyone watching free YouTube is a millionaire?", "Kevin #7 30:26. Don't argue. Ask.", "core"], ["Tension", "CURRENT", "He takes over the call with his own questions.", "What's your success rate? Timeline? Do you run the ads? Do I need my own products?", ["I love it, you've got a list. Can I make a suggestion? Every one of those, the coach can answer with real numbers. My job is to see in ten minutes if that call's worth your time. So let me ask a few, then I'll make sure all of yours get answered. Deal?"], "Okay, um, so, our success rate is…", "Trade with the yapper. Take the frame back.", "core"], ["Tension", "WHY NOW", "He lied about a no-show.", "I was on the Zoom, nobody showed up!", ["Oh okay. Did it say 'waiting for host', or did it just not load?"], "No you weren't, Kev was there for 15 minutes.", "Give a soft way to correct the lie. Don't call it out.", "core"], ["Booking", "BOOK", "Discovery's done.", "(Pitch the call.)", ["So from what you said: [situation], [impact in their words], [goal + what it means], and what you said you need is [roadblock in their words]. That's exactly what [owner]'s team helps with. Next step's a Zoom with [closer], one of our head coaches. He'll look at [their specific thing] and map out a plan. Does tomorrow afternoon work, or is Thursday better?"], "Cool, so I'll connect you with Jack, he'll get more in depth and build a roadmap.", "Scott: recap in their words, bridge, value, two times. Generic pitches get no-shows.", "core"], ["Booking", "LOCK", "Booked.", "(Lock it in.)", ["Sent. Can you check your email real quick and hit accept for me? … Anything that could come up and clash? … And if your [wife/husband] is part of the decision, they should be on it too."], "Great, see you then!", "Accept on the call, clash check, partner on the call. That's how you lift show rate.", "core"], ["Booking", "LOCK", "Spouse decides the money.", "I'd have to talk to my wife.", ["That makes total sense. Then honestly, she should be on the call with you, so she hears it straight and can ask her own questions, instead of you explaining it after. Would that work?"], "Okay, talk to her and call me back.", "Get the decision maker on the call. Never 'call me back'.", "core"], ["Booking", "BOOK", "Tight on money, nervous.", "It's tight, but I'd want to hear what it is.", ["That's fair. The next call will be honest about whether it's the right time. If it isn't, the coach will say so, and that's okay."], "Don't worry, there are payment plans!", "Honesty is what gets tight-money prospects to show up.", "core"], ["Booking", "LOCK", "Double no-show.", "My bad, man. I know. Twice.", ["Do you actually want to do this? If not, totally fine, I'll take you off. … Okay. Accept it now while we're on the phone, set an alarm for 15 minutes before, and if you get nervous, text me before, not after. Deal?"], "Please don't miss it this time.", "Make the yes real or you?", "(and if retirement money comes up) Retirement money stays retirement money."], "Perfect, you have all the time in the world now!", "Respect him, and protect his retirement."], ["Booking", "BOOK", "He wants to think about booking.", "Let me think about it and get back to you.", ["Totally fair. What's the part you want to think about? … The call itself is free and there's no obligation. It's just where you get the full picture, so you can think with real information. Tomorrow at 6, or Thursday?"], "Okay, call me when you're ready.", "'Think about it' at the booking stage usually means one specific worry."], ["Booking", "BOOK", "Wants a time you don't have.", "Can we do Sunday at 9pm?", ["Sunday night's not open, but Monday at 7 or Tuesday at 8 is. Which one?"], "Let me check with the closer and get back to you.", "Hand back two real options straight away."], ["Booking", "LOCK", "Gives a fake-looking email.", "asdf@gmail.com", ["(laugh) Ha, I don't think Kev's invite will get to asdf. What's the one you actually check?"], "Okay, sending to asdf@gmail.com.", "A dead invite means a guaranteed no-show."], ["Booking", "LOCK", "No email at all.", "I don't really use email.", ["No problem at all, I'll text you the link and the time to this number. Can you reply 'got it' when it comes through?"], "You'll need an email to join.", "Adapt. A text confirmation works too."], ["Booking", "LOCK", "Partner can't make that time.", "My wife's at work then.", ["Then let's find one where you're both home, since it's both of your decision. Evenings or weekend?"], "That's fine, you can just tell her about it after.", "The decision maker on the call raises the close rate."], ["Booking", "LOCK", "Reminder call 1 hour before. He forgot.", "Oh crap, that's today?", ["(laugh) It is, in an hour. Still good for 6? If something's come up, no stress, tell me now and I'll move it."], "Yes, and Kev blocked out time for you.", "Make rescheduling easy. Don't make them feel guilty."], ["Booking", "LOCK", "Same-day booking, very hot lead.", "Could I talk to someone today?", ["Let me check. Kev's got 4:30 or 6 today. Which one?"], "Earliest I can do is next Thursday.", "Speed wins on hot leads. Book same day if you can."], ["DQ", "SOFT QUAL", "Lives in a country the offer doesn't serve.", "I'm in India. Is that okay?", ["Thanks for asking. Honestly, I need to check, because the program's set up for [region]. Let me find out properly so I don't waste your time."], "Sure, it works everywhere!", "Never guess on fit. Check."], ["DQ", "CURRENT", "Wants guaranteed returns.", "If you can't guarantee I'll make money, I'm not interested.", ["Then I'll be honest: nobody legit can guarantee you'll make money trading. If someone does, run. If a guarantee's the only way you'd do it, this probably isn't for you, and that's okay."], "You will make money if you follow the system.", "Some people disqualify themselves. Let them."], ["DQ", "CURRENT", "He's clearly in a cult-like hype mindset.", "I'm gonna be a millionaire in six months, bro, I just need the secret.", ["(laugh) Love the energy. I'll be honest, there's no secret, and six months to a million isn't realistic for basically anyone. Do you still want it if it's a few years of real work?", "(if no) Then it's probably not for you right now."], "Absolutely, our students hit that all the time.", "Unrealistic expectations become refunds."], ["DQ", "CURRENT", "Wants it for someone else who isn't interested.", "I want this for my son. He doesn't really want to do it, though.", ["That's really kind of you. Honestly, though, if he's not into it, it won't work. It's a lot of work, and he has to want it. Would he want to talk to me himself?"], "Well, you can sign him up anyway.", "The person doing the work has to want it."], ["Interview", "INTERVIEW", "Hiring manager, first question.", "Tell me about yourself.", ["I'm Stefan, from Moldova, based in Europe. For the last [X] weeks I've trained full-time to set, with [number] recorded roleplays, all reviewed and scored, coached by Scott Clancy inside Jordan Davidson's Just Do Sales. I'm looking for an offer where I can dial hard and book qualified calls."], "Well, I was born in Moldova, and when I was younger…", "20 to 40 seconds. Treat it like a sales pitch, not a CV (Scott)."], ["Interview", "INTERVIEW", "Hiring manager.", "You don't have experience. Why should we hire you?", ["Fair. What I do have is [number] reviewed roleplays and a scorecard I run on every call. When I found I was going in circles, I fixed it with my coach in two weeks. Give me your script and two weeks, and judge me on the numbers."], "I'm a fast learner and very passionate.", "Every applicant says 'passionate'. Proof beats adjectives."], ["Interview", "INTERVIEW", "Hiring manager.", "Your English, will US prospects understand you?", ["I've had that on calls. (smile) Most of the time it's their signal. When someone asks where I'm from, I tell them, make a joke about Moldovan wine, and we keep going. If anything, it makes me listen harder."], "I'm working on my English, sorry.", "Turn it into a strength, calmly."], ["Interview", "INTERVIEW", "Hiring manager.", "What's the job of a setter?", ["Book qualified calls, and protect the closer's calendar from the ones that aren't. Get the prospect to say their situation, impact, goal and roadblock in their own words, so the closer has everything before the call."], "To book as many calls as possible.", "The protect-the-calendar line shows you think like a manager (Scott)."], ["Interview", "INTERVIEW", "Hiring manager.", "Walk me through how you'd qualify financially.", ["After urgency, never before. Capital offers: goal, current income, monthly savings, tight or usual, total, and 'takes money to make money' if they push. Program offers: through income or what they spend, then 'is investing in yourself something you'd be in a position to do?'. Students and the unemployed get the transparent line early."], "I just ask how much they have.", "Show you know two different money paths."], ["Interview", "INTERVIEW", "Hiring manager.", "When would you disqualify someone?", ["Fit: under 18, or outside the market. Financial: they'd hurt themselves to pay. Interest: a temp check of 5 or below with no reason, or 'happy, just clicked the ad'. And I tell them kindly and give them something free."], "I never disqualify, every lead is an opportunity.", "Managers love setters who protect show rates."], ["Interview", "INTERVIEW", "Live roleplay test. The manager plays a happy prospect.", "Honestly, I'm good. I like my job. Just curious.", ["(after testing it properly) Then I'll be straight with you: I don't think booking you in makes sense right now. You're happy, there's no rush. If that changes, give me a shout."], "(forcing a booking to look good)", "A clean DQ in the interview impresses more than a forced booking."], ["Interview", "INTERVIEW", "End of the interview.", "Any questions for us?", ["Yes, a few. How many new leads come in per day, and how many conversations does a setter usually have? What's the show rate right now? How are commissions paid? And why did the last setter leave?"], "No, I think you covered everything.", "Vet the offer. Good offers answer with numbers."], ["Interview", "INTERVIEW", "Hiring manager.", "What would you do on your first day?", ["Watch the owner's content until I sound like them, read every script and objection doc, listen to the closer's best calls, shadow the top setter's dials, then dial."], "Start calling leads straight away.", "Prep first, then volume."], ["Interview", "INTERVIEW", "Hiring manager.", "Why do you want to set for us specifically?", ["[One specific thing about their offer or content]. I want to set for something I can stand behind, and this is that. And your leads are [niche], which is exactly what I've been practising."], "I just need a job right now.", "Tie it to their offer (Scott)."], ["Interview", "INTERVIEW", "He asks about the long term.", "Where do you see yourself in a year?", ["Being your top setter. Numbers first. If there's a path to closing later, great, but I'd earn it from that seat."], "Closing. Setting is just a stepping stone.", "Atefur: don't say you want to leave the seat."], ["On the offer", "DAY 1", "Your manager hands you the script.", "Here's the script. Start dialling in an hour.", ["Got it. Can I listen to two of the top setter's calls first, and read the objection doc? I want to sound like the owner from my first dial."], "(dial cold with no prep)", "Ten minutes of prep beats an hour of bad dials."], ["On the offer", "DAY 1", "A lead says a phrase from the owner's content.", "Like Ray says, 'risk first, profits second', right?", ["Exactly, risk first. (laugh) Sounds like you've been watching for a while. What's been your favourite video?"], "Who said that?", "Know the owner's catchphrases cold."], ["On the offer", "CLOSER", "The closer messages you.", "That last lead had no money. Why'd you book him?", ["You're right, my bad. I took 'I've got some saved' without getting a number. From now on I'll get a rough figure on every booking and put it in the note."], "He said he had money, it's not my fault.", "Own it, fix it, and say what you'll change."], ["On the offer", "CLOSER", "The closer asks what he should know.", "Anything I should know about Thursday's 6pm?", ["Yeah. Wife's on the call and she's sceptical, he got burnt by a crypto group. His line was 'I don't want to be in this truck at 40'. Temp check 9, held back by fear of losing it again. Four K saved, three of it is emergency money."], "He seemed keen!", "A great closer note is half the close."], ["On the offer", "MANAGER", "Your numbers are low after week one.", "Your bookings are low. What's going on?", ["Here's my week: [dials], [conversations], [bookings]. My conversation-to-booking rate is the problem, so it's my discovery or my pitch. Can you review two of my calls this week?"], "The leads are bad.", "Bring numbers and a hypothesis, not excuses."], ["On the offer", "MANAGER", "A lead complains about you.", "A lead said you were pushy. What happened?", ["I'll pull the recording and listen. If I was, I'll fix it. Can we look at it together for five minutes?"], "I wasn't pushy, he was just difficult.", "Coachable beats defensive."], ["On the offer", "SELF", "You blank mid-call and forget his name.", "(you've forgotten his name)", ["(check the CRM) …So, Marcus, you were saying…", "(if you can't see it) Sorry, remind me how you like to be called?"], "Hey… buddy… so…", "Keep the CRM open on screen."], ["On the offer", "SELF", "You realise you said the wrong closer's name.", "Wait, I thought you said Jack?", ["My bad, I mixed it up. It's Kev. He's one of Ray's head coaches. I'll send the invite so you've got it in writing."], "(ignore it and hope)", "Fix it on the spot, in writing."], ["On the offer", "SELF", "Your fifth rejection in a row, and you're about to dial.", "(your mood is low)", ["(stand up, deep breath, read your opener out loud once, smile, dial)"], "(dial with a flat, defeated tone)", "Every call is a new prospect. They can hear your mood."], ["On the offer", "SELF", "Your manager says to call 30 old leads today.", "(old lead list)", ["(use the old-lead opener) This is a bit of a random one. You reached out back in [month] about [X] and never got a proper call. Where are you at with it now?"], "Hi, this is a follow-up on your inquiry from 6 months ago.", "Admitting it's random lowers the guard on an old lead."], ["You", "OPEN", "You start tensing up because a US prospect talks fast.", "(fast American accent, slang you didn't catch)", ["Sorry, say that one more time? I want to make sure I get it right."], "(pretending you understood, then asking an irrelevant question)", "Asking again is fine. Faking it isn't."], ["You", "OPEN", "He mocks your accent.", "Where are you calling from, Russia? (laughs)", ["(laugh) Close, Moldova. Next door to Romania. Way better wine than Russia, I promise. So, what got you looking at trading?"], "No, Moldova is not Russia, it's a separate country.", "Don't get offended. Laugh, correct it lightly, and get back to the call."], ["You", "CURRENT", "You notice you're about to say 'like, I guess'.", "(you're about to ask what he does for work)", ["What do you do for work at the moment?"], "So, like, I guess, what would you say you do, like, work-wise?", "Your habit #7. Five questions, by heart, said clean."], ["You", "CURRENT", "You're about to label his roadblock.", "(he said: YouTube's all over the place)", ["What do you think it'd take for you to actually get there?"], "So you're more after the guidance, right?", "Your habit #1. Make him say it."], ["You", "CURRENT", "He drops a heavy line casually.", "My dad didn't recognise me last week. Dementia. Anyway.", ["(pause) Your dad didn't recognise you. … How has that been for you?"], "Sorry to hear that. So, anyway, what's your goal with trading?", "Your habit #3. Catch it, slow down, two follow-ups."], ["You", "MONEY", "You're nervous about the credit question.", "(it's time to ask about credit)", ["And in terms of credit, where are you at?", "(then stop talking)"], "(pause) So, um, sorry, I just have to ask, do you, like, maybe have any credit cards?", "Atefur: not 'like a cute girl at the bar'. Fewer words, no apology."], ["You", "BOOK", "You're about to pitch generically.", "(discovery's done)", ["So from what you said, [their situation and impact, their words], you want [goal + meaning], and what you said you need is [roadblock, their words]. Next step's a Zoom with [closer]. He'll [specific value]. Tomorrow at 6, or Thursday?"], "So yeah, I'll connect you with Jack, he'll help you build a roadmap.", "Your habit #6. A recap in their words beats a generic pitch."], ["You", "URGENCY", "You're about to skip the temp check because he seems keen.", "(he's been positive the whole call)", ["On a scale of 1 to 10, how important is it for you to [goal]? … What makes it a [number]? … What's holding it back from a 10?"], "(go straight to booking)", "Your habit #9. Keen isn't the same as committed. The answer to 'what's holding it back' is the closer's gold."], ["You", "CURRENT", "He's comfortable, likes his job, just saw an ad.", "My job's chill honestly. Flexible hours. I just saw the ad.", ["(test it) What would need to change for this to really matter to you?", "(if nothing) Then honestly, booking you in doesn't make sense right now. Give me a shout if that changes."], "Okay! And how much do you have set aside to invest?", "Your habit #10 (K8). Not everyone should be booked."], ["You", "CURRENT", "You want to say he could do it on his own anyway.", "I'll just use free videos.", ["That's fair. So what's stopped the free stuff from working so far?"], "Do you think everyone watching free YouTube is a millionaire?", "Kevin #7. Ask, don't argue."], ["Openers", "OPEN", "He picks up and says nothing for three seconds.", "(silence) …Hello?", ["Hey, is that Marcus? It's Stefan from Ray's team, you put your info in about trading. Good time for a quick chat?"], "HELLO? CAN YOU HEAR ME?", "Delays are normal on mobile. Calm, clear, start again."], ["Openers", "OPEN", "He answers already annoyed.", "Yeah, what?", ["(calm, warm) Hey, it's Stefan from Ray's team, about the trading form. Sounds like I caught you at a bad one. Want me to try you later?"], "Oh, sorry, I'll be quick, I promise!", "Match calm, not panic. Offer the exit, and most people stay."], ["Openers", "OPEN", "He's clearly at the gym, breathing hard.", "Yeah, I'm mid-set, what's up?", ["(laugh) Respect. I'll let you finish. Is after your workout better, or tonight?"], "This will only take ten minutes.", "Don't do discovery with someone who can't talk properly."], ["Openers", "OPEN", "He's at his kid's game.", "I'm at my son's game, can you call later?", ["Of course, enjoy it! Tonight after 7, or tomorrow morning?"], "It'll only be five minutes!", "Kids first. Book the callback with two options."], ["Openers", "OPEN", "He's in a different time zone than the CRM says.", "Bro, I'm in California. It's 6am.", ["Ah, I'm so sorry, the system had you on Eastern. My bad completely. What's a good time later today, your time?"], "Oh, but since you're up…", "Fix the time zone in the CRM so it never happens again."], ["Openers", "OPEN", "A woman answers. The lead name is Chris.", "This is Chris.", ["Hey Chris, it's Stefan from Leo's team. You put your info in about starting a store. What made you fill it out?"], "Oh, sorry, I thought Chris was a guy.", "Never assume from a name. Just carry on."], ["Openers", "OPEN", "He's speaking Spanish to someone in the room.", "(to someone) Un momento. (to you) Yeah?", ["Sin problema. (laugh) Hey, it's Stefan, about the form you filled out on Leo's page. Is now okay?"], "(waiting in silence for a minute)", "A tiny bit of warmth goes a long way."], ["Openers", "OPEN", "You've called him four times this week. He finally answers.", "Man, you've called me like four times.", ["(laugh) I know, I'm persistent, sorry. You filled out the form, so I wanted to make sure you didn't fall through the cracks. Is it still something you're looking at, or should I stop?"], "Well, you did fill out the form.", "Own it, give a reason, and offer the exit."], ["Openers", "OPEN", "Lead from a quiz three weeks ago.", "What quiz?", ["The 'what kind of business fits you' one on Instagram, about three weeks ago. It said you'd suit e-com. Ring a bell?"], "You took our quiz, remember?", "Remind them with specifics, not 'remember?'."], ["Openers", "OPEN", "He answers by repeating your name back.", "Stefan… from where?", ["From Ray Thompson's team. The trading guy on YouTube. You applied on his page Tuesday."], "Stefan. S-T-E-F-A-N.", "He wants the context, not the spelling."], ["Pushback", "CURRENT", "He says your questions are personal.", "These are pretty personal questions.", ["They are, you're right. I'm not asking for the sake of it. The better I understand where you're at, the better the next call can actually help. You can skip anything you don't want to answer."], "Sorry, I'll stop asking.", "Atefur's reason line, plus permission to skip. Most people then answer."], ["Pushback", "CURRENT", "He wants to know your success rate personally.", "How many people have you booked who actually made money?", ["Honestly, I'm the first call, so I don't track that, and I won't guess. The coach can show you real results from people in a similar spot to you."], "Loads, like 90% of them.", "Never invent stats."], ["Pushback", "CURRENT", "He thinks you're commission-hungry.", "You're just trying to get commission off me.", ["(laugh) I do get paid when I do my job well, I won't lie. But I get paid more for booking people who actually fit, so the worst thing for me is booking you if it's not right."], "No, I'm just trying to help.", "Honesty beats denial."], ["Pushback", "CURRENT", "He asks for the owner's personal number.", "Can I just text Ray directly?", ["I get it, Ray's who you follow. The way it works is you speak with one of his head coaches first, and they work with him every day. That's how everyone gets proper time."], "Sure, here's his number.", "Never give out private numbers. Frame the coach as an upgrade."], ["Pushback", "CURRENT", "He saw a lower price somewhere else.", "There's a guy on YouTube doing this for $97.", ["Fair. There are cheaper options, and for some people they're the right fit. What made you not go with the $97 one?"], "That's a scam, you get what you pay for.", "His answer tells you what he actually needs."], ["Pushback", "CURRENT", "He says the economy is too bad.", "With the economy right now, I don't know if it's the time to spend anything.", ["That makes total sense, everything's expensive. Can I ask, if nothing changes and the economy stays like this, how does that leave you a year from now?"], "Actually, recessions are the best time to invest!", "Agree, then future-pace their situation."], ["Pushback", "CURRENT", "He says he's too old to learn.", "I'm 52, isn't this for young people?", ["Not at all. Honestly, a lot of the people who do best have life experience. What made you think it might be just for young people?"], "Age is just a number!", "Find where the belief comes from. Don't wave it away."], ["Pushback", "CURRENT", "He doubts it because of AI.", "Won't AI replace setters and traders anyway?", ["Could be, some parts. I honestly don't know where it all goes. What's making you think about that, for you specifically?"], "No, AI could never do this.", "Don't debate the future. Find the fear underneath."], ["Pushback", "CURRENT", "He wants a free trial.", "Do you have a free trial?", ["Good question. The call with the coach is free, and that's where you'd go through everything, including how it all works and whether there's anything like that."], "Yes, seven days free.", "Never state terms you're not sure of."], ["Pushback", "CURRENT", "He's comparing offers by spreadsheet.", "I'm comparing four programs on a spreadsheet. What makes you different?", ["Love that you're doing it properly. What are the columns on your spreadsheet? … That's exactly what the coach should go through with you, line by line."], "We're the best in the industry.", "His criteria tell the closer what to cover."], ["Pushback", "CURRENT", "He says friends told him it's a scam.", "My friends say all of this is a scam.", ["That's fair, a lot of it is. What specifically did they say? … And what made you look anyway?"], "Your friends are wrong.", "Agree with the part that's true, then get his reason."], ["Pushback", "CURRENT", "He needs to check with his accountant.", "I'd want my accountant to look at it.", ["Smart. Would it make sense to have the call when you've got everything you'd want to show him? Or he's welcome on the call too."], "You don't need an accountant for this.", "Respect a careful buyer."], ["Pushback", "CURRENT", "He thinks it's MLM because of recruiting talk.", "Do I have to recruit people?", ["No, nobody recruits anybody. It's [the actual business]. If anything ever asks you to recruit to get paid, that's an MLM, and that's not this."], "Only if you want to earn more!", "A clear no, and a simple test he can use."], ["Pushback", "CURRENT", "Asks how you got into this.", "How'd you even end up doing this job?", ["(laugh) Honestly, I was in your shoes, looking for something remote. I trained for it, I practise every day, and now I help people figure out if this is right for them. So, back to you…"], "Long story… (tells it for two minutes)", "One honest sentence, then back to them."], ["Money", "MONEY", "Capital offer. He says he has savings but they're tied up.", "It's all in my 401k and some stocks.", ["Okay, good to know. Outside the 401k, is there anything liquid, money you could use without touching retirement?", "(if no) Then retirement stays retirement. The coach will tell you honestly whether it makes sense right now."], "You could take a loan from your 401k.", "Never suggest touching retirement."], ["Money", "MONEY", "Program offer. He says money's tight but he'd 'find a way'.", "Money's tight, but I'd find a way.", ["I appreciate that. Just so I understand, what would 'finding a way' look like for you? I don't want you stretching yourself in a way that makes things harder."], "Great, that's the commitment we need!", "'Find a way' sometimes means debt. Check it gently."], ["Money", "MONEY", "He's self-employed with irregular income.", "It depends, some months 10K, some months nothing.", ["Makes sense, that's the self-employed life. Averaged across the year, what would you say it is? … And on the nothing months, how do you get through?"], "So let's just say 10K.", "Use the average and the floor, not the best month."], ["Money", "MONEY", "He asks what the money question is even for, on a health offer.", "Why does a fitness coach need to know my savings?", ["Fair question. It's so the coach suggests something that actually fits your budget. Some people want something light, some want everything. I'd rather know than guess."], "Because coaching isn't cheap.", "Make the reason about his fit."], ["Money", "MONEY", "Couple. One says one number, the other a different one.", "He: we've got about ten saved. She: it's more like six, babe.", ["(laugh) Okay, so somewhere six to ten. That's helpful, thank you both. Is that all savings, or some of it is set aside for something?"], "So which is it?", "Don't referee. Get the range, then the purpose."], ["Money", "MONEY", "He expects you to quote the price before giving his numbers.", "Tell me the price first, then I'll tell you what I've got.", ["Fair trade, but honestly I don't know what the coach would recommend for you yet, so a number now would just be a guess. That's what the call is for. A rough idea of what you're working with is all I need."], "Okay, it's five thousand.", "Stay in your lane. Say less, and ask again, smaller."], ["Money", "MONEY", "He has money but says it's for a house deposit.", "I've got 30K, but that's for the house.", ["Makes total sense, house money stays house money. Outside of that, what's available?"], "You could use some of it and still buy the house.", "Respect off-limits money and write it in the closer note."], ["Money", "MONEY", "He's on commission and had a bad month.", "Last month I made like twelve hundred.", ["And is that a usual month, or a tight one? What's an average month look like across the year?"], "Oh. That's quite low.", "One bad month isn't the full picture."], ["Money", "MONEY", "He refuses any number.", "I'm not telling you any numbers.", ["That's okay, I won't push. Without any idea, I can't know if the next call would be a good use of your time. Would you rather I give you a rough range of what people usually invest, so you can tell me if it's completely out of the question?"], "Then I can't help you.", "Some offers allow a range, so check yours. If not, the transparent line works."], ["Tension", "CURRENT", "He gets emotional about his kids.", "(voice cracks) Sorry. My daughter… yeah.", ["(gently) Take your time. No rush."], "It's okay, don't cry! So, moving on…", "Silence and warmth. Let him come back."], ["Tension", "CURRENT", "He calls you 'buddy' in a condescending way.", "Look, buddy, I've been in business longer than you've been alive.", ["(laugh) Probably true. That's exactly why I want to understand what you've built before anything. What's the business doing right now?"], "Sir, with respect…", "Give status, then get curious."], ["Tension", "CURRENT", "He says 'you're reading this off a sheet'.", "You sound like you're reading off a sheet.", ["(laugh) Fair, I'll put the notes down. Real question, then: what actually got you looking at this?"], "No, I'm not.", "Admit it lightly, then drop the script tone."], ["Tension", "CURRENT", "Background argument at his house.", "(shouting in the background) Sorry, one sec. (to someone) I SAID I'M ON THE PHONE!", ["(after) Sounds like it's a lot right now. Want me to call you back in an hour?"], "(carry on with discovery)", "Read the room. A bad moment gives a bad call."], ["Tension", "CURRENT", "He's clearly testing your patience with jokes.", "My goal? To be a billionaire. On a yacht. With a tiger. (laughs)", ["(laugh) Love the tiger. Okay, before the tiger, what would the first real milestone be, say a year from now?"], "That's not realistic.", "Laugh, then ground it."], ["Tension", "CURRENT", "He corrects your English.", "It's 'fewer', not 'less'. (laughs)", ["(laugh) Thank you, I'll take free lessons. So, where were we, you said the job's…"], "Sorry, English isn't my first language…", "Laugh it off in one line and keep going."], ["Tension", "CURRENT", "He keeps checking another call.", "Hold on, I've got another call coming in.", ["No problem. Want to take it and I'll call you back in ten?"], "Can you ignore it? We're almost done.", "Respect his time, and he'll respect yours."], ["Tension", "CURRENT", "He hangs up mid-sentence.", "(call drops)", ["(call back once) Hey, think we got cut off. You were just saying the job's been…"], "(call back six times)", "One callback, starting from his sentence. Then text."], ["Tension", "CURRENT", "He hangs up on purpose after the money question.", "(hangs up)", ["(text once) Hey Marcus, Stefan here. No pressure at all. If you want to pick it back up, I'm here. If not, all good."], "(call back angry)", "One respectful text. Then let it go."], ["Sensitive", "CURRENT", "He mentions a recent divorce.", "My wife left in March.", ["I'm sorry. That's a lot. How are you doing with it?"], "Oh. Well, a fresh start is the perfect time to start a business!", "Never use pain as a sales lever."], ["Sensitive", "CURRENT", "He's caring for a sick parent.", "I look after my mum, she's got cancer.", ["I'm really sorry. That's a lot on your shoulders. How are you holding up?"], "That's why you need financial freedom!", "Be human first. Then, if it fits, carry on gently."], ["Sensitive", "CURRENT", "He says he's a veteran with PTSD.", "I'm a vet. I don't do well in offices. PTSD.", ["Thank you for telling me, and for serving. Is working from home part of why this appeals to you?"], "Oh, a lot of vets do great at this!", "Don't assume or promise. Let him lead."], ["Sensitive", "CURRENT", "Weight loss. She mentions an eating disorder history.", "I had an eating disorder in college.", ["Thank you for telling me. That's really important. Is that something you're getting support with now? … Our coaches aren't medical professionals, so I'd want that to stay with your doctor or therapist."], "Don't worry, it's not a strict diet.", "A serious medical boundary. Flag it, and don't push."], ["Sensitive", "CURRENT", "He's being evicted.", "I'm getting evicted in two weeks.", ["I'm sorry, that's scary. Honestly, right now the priority is a place to live, not a program. Can I give you 211? It's free, and they connect you to local housing hel nt to spam.", "I don't see it.", ["Can you check spam or promotions for me? … Got it? Hit 'not spam' and accept, so the reminder lands too."], "I'll resend it later.", "Fix it live."], ["Booking", "LOCK", "He asks what to prepare.", "Do I need to prepare anything?", ["Just be somewhere quiet, ideally at a laptop. And if you've got [your trade history / store numbers / credit reports], have them open. Kev will want to look."], "No, just show up.", "Prep makes them invested, and helps the closer."], ["Booking", "LOCK", "Day-before reminder text. No reply.", "(no reply)", ["(morning-of call) Hey Marcus, Stefan here, just making sure you're still good for 6 with Kev today?"], "(nothing until the call)", "One more touch on the day cuts no-shows."], ["Booking", "LOCK", "He asks to move the call to a time the closer doesn't have.", "Can we do 9pm instead?", ["9's not open, but 7:30 tomorrow or 6 Thursday is. Which works better?"], "Let me ask Kev and get back to you.", "Hand back real options straight away."], ["Booking", "LOCK", "He no-showed, then texts 'sorry'.", "sorry man totally forgot", ["No stress at all, it happens. Want to grab tomorrow at 6 or Thursday at 7? And I'll text you an hour before."], "That's okay, but please don't do it again.", "No guilt, fast rebook, extra reminder."], ["Booking", "LOCK", "Partner joins and says 'we're not buying anything today'.", "Just so you know, we're not buying anything on this call.", ["Totally fair, and this call isn't for buying. It's just me understanding where you're at. If the next call makes sense, you'll decide then, together."], "Don't worry, we never push.", "Lower the stakes of every step."], ["DQ", "CURRENT", "He wants it for his business partner who isn't on the call.", "My partner's the one who'd do it, but he's busy.", ["Then honestly, it should be him I talk to, since he'd be doing the work. Can we find a time with him?"], "No problem, you can tell him about it.", "Talk to the person doing the work."], ["DQ", " ger asks about rejection.", "How do you handle a day of nos?", ["I track it. A day of nos is data. Is it my opener, my discovery, or the leads? I stand up between dials, read my opener out loud once, and keep the numbers going."], "Rejection doesn't bother me.", "Show the system, not bravado."], ["Interview", "INTERVIEW", "Hiring manager asks about US hours.", "Our leads are US. Can you work till 2am?", ["Yes. I'm in Moldova, so US afternoons and evenings are my working hours. I've built my sleep around it: mornings are sleep and gym, afternoons and nights are dials."], "I'll try my best.", "Answer it before it becomes a doubt."], ["Interview", "INTERVIEW", "He asks about your numbers.", "What were your numbers in roleplays?", ["[Number] recorded roleplays, all scored on a 20-point card. I started around [X] and I'm consistently at [Y] now. I can send you the scorecards and recordings."], "I did really well in all of them.", "Numbers and proof."], ["Interview", "INTERVIEW", "He plays a hostile prospect in the test.", "Who the hell is this? Stop calling me.", ["(calm) Sorry about that, it's Stefan from [owner]'s team. You filled out a form about [X]. If you want me to take you off, I'll do it right now."], "(getting defensive)", "They're testing your calm."], ["Interview", "INTERVIEW", "He asks why you left your last job.", "Why are you leaving what you do now?", ["I want to be paid for performance, and I'd rather be great at one thing. Setting's that thing, and I've trained for it every day for [X] weeks."], "My boss was terrible.", "Never trash past jobs."], ["Interview", "INTERVIEW", "He asks what you'd do if a lead asks the price.", "A lead asks the price three times. What do you do?", ["First time: it depends, that's what the call's for. Second: I name it, 'I can tell this is bugging you', and give a little, like 'it's an investment, not a fifty-dollar course'. Third: I promise the closer will go through it straight."], "I'd tell them the price.", "Show you protect the closer's call."], ["Interview", "INTERVIEW", "He asks how you'd ramp up.", "How fast can you be productive?", ["Day one and two: owner content, scripts, best calls, shadowing. Day three I'm dialling. By the end of week one I'll send you my numbers, unasked."], "Pretty fast, I learn quickly.", "A specific plan beats an adjective."], ["On the offer", "CLOSER", "The closer says the lead was 'not qualified'.", "That one was a waste of my time.", ["Fair, sorry. What did he say that you'd have wanted me to catch? I'll add it to my questions."], "He seemed qualified to me.", "Turn every complaint into a better question."], ["On the offer", "MANAGER", "Your show rate is low.", "Half your bookings don't show.", ["Agreed, that's my lock-in. From today: invite accepted on the call every time, partner on the call, a text right after, the evening before, and an hour before. I'll report the show rate on Friday."], "The leads are flaky.", "Own it, fix it with a system, and report back."], ["On the offer", "MANAGER", "A manager asks you to push harder on money.", "You need to qualify harder on money.", ["Got it. Can you show me one call where it was done well, so I can copy the wording? And should I move the money questions earlier for this offer?"], "I don't want to sound pushy.", "Coachable, specific, and copy what works."], ["On the offer", "SELF", "You realise you booked someone who should've been a DQ.", "(you realise after the call)", ["(message the closer) Heads up on Thursday's 6pm: I think he might be a DQ, because [reason]. Want me to call him back and check, or do you want to keep it?"], "(say nothing and hope)", "Protect the closer's calendar, even after the call."], ["On the offer", "SELF", "Dead lead list, 0 answers in 40 dials.", "(no one picks up)", ["(switch: double dial, then text) Hey [name], Stefan from [owner]'s team. Tried you about [X]. When's better, before or after 5?"], "(keep dialling the same way)", "Change the method, not the effort."], ["On the hould be on the call with Priya too, so they hear it straight and can ask their own questions. When are you both home?"], "Okay, talk to them and let me know.", "Get the decision maker on the call. Never accept 'I'll let you know'.", "new"], ["Niche punches", "TIMEFRAME", "Confidence · Mike, 30, IT support at a university, Columbus. You asked what they've tried.", "I tried six books. It didn't really work.", ["Okay. Walk me through it. What happened with six books?", "And what do you think went wrong?"], "Yeah, that stuff never works. Ours is different.", "Never trash what they tried. Their answer shows the roadblock, and whether they've been burnt.", "new"], ["Niche punches", "ROADBLOCK", "Confidence · Mike, 30, IT support at a university, Columbus. Roadblock.", "Honestly, I just don't have the time.", ["That's fair. And if it's just a time thing, why not just keep going on your own, instead of getting help from someone like us? … So what were you hoping we could do for you?"], "It only takes an hour a day!", "Atefur #4: the time move makes them say the real roadblock. Leave time commitments to the closer (Scott).", "new"], ["Niche punches", "URGENCY", "Confidence · Mike, 30, IT support at a university, Columbus. Temp check, what's holding it back.", "I'm not sure it works for someone like me.", ["'Someone like you.' What do you mean by that?", "(after they answer) What makes you say that?"], "Of course it works for you! Everyone can do it.", "That's a limiting belief. Get it said out loud, and flag it for the closer. Don't argue it away.", "new"], ["Niche punches", "OPEN", "Confidence · Mike, 30, IT support at a university, Columbus. First minute.", "Is this legit? There's so much fake stuff out there.", ["Honestly, that's a smart question. There's a lot of fake stuff. I'm not selling you anything on this call, I'm just seeing if it makes sense. If it doesn't, I'll tell you. And ask Priya everything on the next call."], "Totally legit, Ellis has helped thousands of people!", "Agree with the worry. Defending makes you sound less legit.", "new"], ["Niche punches", "ROADBLOCK", "Confidence · Mike, 30, IT support at a university, Columbus. They push back on needing help.", "I could probably figure it out on my own.", ["You might. So what's stopped it from working so far, in the last eight years?", "What do you think it'd take for you to actually get there?"], "Most people who try alone fail.", "Let them argue with their own timeline, not with you.", "new"], ["Niche punches", "OPEN", "Confidence · Mike, 30, IT support at a university, Columbus. Early in the call.", "I'm already doing another program.", ["Nice, good for you for jumping in. How's it going so far?", "(later) I'm not here to trash anybody's program. What made you look at us as well?"], "Oh. Well, ours is better.", "Curiosity, not competition. They'll tell you the gap themselves.", "new"], ["Niche punches", "CURRENT", "Confidence · Mike, 30, IT support at a university, Columbus. Intent question.", "I just want to be more confident.", ["When was the last time you really felt that? Like, a specific moment.", "What would be different for you if it changed?"], "Why do you want to be more confident? … But why?", "Change the angle. Don't ask the same why again (Scott, Syndicate call).", "new"], ["Niche punches", "CURRENT", "Confidence · Mike, 30, IT support at a university, Columbus. You asked about the IT job.", "It's fine, I guess.", ["(two seconds of silence)", "…Fine?"], "Okay, cool. And how long have you been looking at this?", "Silence gets more than another question. Then repeat their word as a question (Atefur).", "new"], ["Niche punches", "URGENCY", "Confidence · Mike, 30, IT support at a university, Columbus. Temp check.", "Like a five, I guess.", ["How come only a five?", "…Is this something you actually want to change now, or something you'll keep kicking down the road?"], "Five's not bad! Let's book you in.", "Six or below: ask why, then a binary challenge. Then either disqualify or get a real number.", "new"]]];
const DNAME=["Check 1 · Core","Check 2 · The 150 calls","Check 3 · New scenarios"];
const DSUB=["The original deck: Scott, Atefur, your habits","One card from every roleplay in GitHub","Situations not in any call yet"];
const D=[];DECKS.forEach((deck,di)=>deck.forEach((c,ci)=>D.push({id:"d"+(di+1)+"-"+ci,deck:di,cat:c[0],stage:c[1],ctx:c[2],line:c[3],good:c[4],dont:c[5],why:c[6],src:c[7]||"new"})));
let deck=-1,cat="All",order=[],i=0,shown=false,exam=null;
let S={};try{S=JSON.parse(localStorage.getItem("drills2")||"{}")}catch(e){S={}}
const save=()=>{try{localStorage.setItem("drills2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const inDeck=c=>deck<0||c.deck===deck;
const pool=()=>D.filter(c=>inDeck(c)&&(cat==="All"||c.cat===cat));
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function decks(){
  const tabs=[{k:-1,n:"Mix all",s:D.length+" cards, everything"}].concat(DNAME.map((n,k)=>({k,n,s:DECKS[k].length+" cards · "+DSUB[k]})));
  $("decks").innerHTML=tabs.map(t=>`<button class="tab${t.k===deck?" on":""}" data-k="${t.k}"><b>${t.n}</b><span>${t.s}</span></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{deck=+b.dataset.k;cat="All";exam=null;decks();chips();build()});
}
function chips(){
  const cats=["All",...new Set(D.filter(inDeck).map(c=>c.cat))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;exam=null;chips();build()});
}
function build(){const p=pool();order=shuffle(p.map(c=>c.id)).sort((a,b)=>(S[a]||0)-(S[b]||0));if(exam){order=shuffle(p.map(c=>c.id)).slice(0,20);exam={ok:0,miss:[],n:order.length}}i=0;render()}
function stats(){
  const p=pool();const done=p.filter(c=>(S[c.id]||0)>=2).length;
  $("count").textContent=`${p.length} cards · ${deck<0?"all checks":DNAME[deck]}${cat==="All"?"":" · "+cat}`;
  $("score").textContent=exam?`20-card check: ${i}/${exam.n} · ${exam.ok} nailed`:`${done} of ${p.length} nailed twice or more`;
  $("prog").style.width=(exam?Math.round(i/exam.n*100):(p.length?Math.round(done/p.length*100):0))+"%";
  $("exam").classList.toggle("on",!!exam);$("exam").textContent=exam?"Stop check":"20-card check";
}
function cardById(id){return D.find(c=>c.id===id)}
function render(){
  stats();
  if(exam&&i>=exam.n){return result()}
  if(!order.length){$("card").innerHTML="<p>No cards here.</p>";return}
  const c=cardById(order[i%order.length]);shown=false;
  $("card").innerHTML=`<div class="meta"><div class="stage">${esc(c.stage)} · ${esc(c.cat)}</div><div class="src">${esc(c.src==="core"?"Check 1":c.src==="new"?"Check 3 · new":"Check 2 · "+c.src)}</div></div>
  <div class="ctx">${esc(c.ctx)}</div><div class="line">“${esc(c.line)}”</div>
  <div class="say">Say your answer <b>out loud</b> before you reveal.</div>
  <div class="ans" id="ans"><h3>Say something like</h3>${c.good.map(x=>"<p>"+esc(x)+"</p>").join("")}<h3 class="no">Not this</h3><p>${esc(c.dont)}</p><p class="why">${esc(c.why)}</p></div>
  <div class="btns" id="btns"><button class="b p" id="rev">Reveal</button><button class="b" id="skip">Skip →</button></div>`;
  $("rev").onclick=reveal;$("skip").onclick=()=>{if(exam){exam.miss.push(c.id)}next()};
}
function reveal(){if(shown)return;shown=true;$("ans").className="ans show";$("btns").innerHTML=`<button class="b g" id="ok">Nailed it</button><button class="b r" id="again">Again</button>`;$("ok").onclick=()=>mark(1);$("again").onclick=()=>mark(-1)}
function mark(v){const id=order[i%order.length];S[id]=Math.max(0,(S[id]||0)+v);save();if(exam){if(v>0)exam.ok++;else exam.miss.push(id)}else if(v<0){order.splice(Math.min(order.length,i+4),0,id)}next()}
function next(){i++;render()}
function result(){
  const pct=Math.round(exam.ok/exam.n*100);
  const verdict=pct>=85?"Ready for live calls on this set.":pct>=65?"Close. Drill the misses below, then run another check.":"Not yet. Go back to practice mode on this set.";
  $("card").innerHTML=`<div class="result"><h2>${exam.ok} / ${exam.n} · ${pct}%</h2><p>${verdict}</p>${exam.miss.length?"<p class='muted'>Missed:</p><ul>"+exam.miss.map(id=>{const c=cardById(id);return "<li><b>“"+esc(c.line)+"”</b><br><span class='muted'>"+esc(c.good[0])+"</span></li>"}).join("")+"</ul>":"<p>No misses.</p>"}
  <div class="btns"><button class="b p" id="again2">Run another check</button><button class="b" id="back">Back to practice</button></div></div>`;
  $("again2").onclick=()=>{exam={};build()};$("back").onclick=()=>{exam=null;build()};
}
$("exam").onclick=()=>{exam=exam?null:{};build()};
$("reset").onclick=()=>{if(confirm("Reset all saved progress on this device?")){S={};save();build()}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key===" "){e.preventDefault();reveal()}else if(e.key==="1"&&shown)mark(1);else if(e.key==="2"&&shown)mark(-1);else if(e.key==="ArrowRight"&&!shown)next()});
$("theme").onclick=()=>{const r=document.documentElement;const cur=r.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",dark?"light":"dark")};
decks();chips();build();
</script>
