<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setter Drills</title>
<style>
:root{--bg:#f6f5f2;--card:#ffffff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e3e1dc;--accent:#2f5bd3;--good:#1f8a4c;--bad:#b3261e;--chip:#eeece7;--warn:#9a6700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1c1c1f;--ink:#f1f1f3;--muted:#a0a0a8;--line:#2c2c31;--accent:#7c9bff;--good:#4cc27e;--bad:#ff7a70;--chip:#26262b;--warn:#e3b341}}
:root[data-theme="dark"]{--bg:#121214;--card:#1c1c1f;--ink:#f1f1f3;--muted:#a0a0a8;--line:#2c2c31;--accent:#7c9bff;--good:#4cc27e;--bad:#ff7a70;--chip:#26262b;--warn:#e3b341}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:700px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:19px;margin:0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tab{flex:1;min-width:140px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 11px;cursor:pointer;font-size:14px}
.tab b{display:block;font-size:14px}
.tab span{font-size:12px;color:var(--muted)}
.tab.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:280px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stage{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
.src{font-size:12px;color:var(--muted)}
.ctx{font-size:13px;color:var(--muted);margin:6px 0 12px}
.line{font-size:21px;line-height:1.35;font-weight:600;margin:6px 0 14px}
.say{font-size:14px;color:var(--muted);margin-bottom:10px}
.ans{display:none;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.ans.show{display:block}
.ans h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px;color:var(--good)}
.ans h3.no{color:var(--bad)}
.ans p{margin:4px 0 8px}
.why{font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button.b{flex:1;min-width:110px;border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink)}
button.p{background:var(--accent);color:#fff}
button.g{background:var(--good);color:#fff}
button.r{background:var(--bad);color:#fff}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;background:var(--good);width:0}
.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:4px 0 10px}
.tog,.small{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.small.on{border-color:var(--warn);color:var(--warn)}
.result h2{margin:0 0 6px;font-size:22px}
.result li{margin:6px 0}
footer{margin-top:16px;font-size:12px;color:var(--muted)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Setter Drills</h1><div class="muted" id="count"></div></div>
  <button class="tog" id="theme" aria-label="Toggle theme">◐ Theme</button>
</header>
<div class="row" id="decks"></div>
<div class="row" id="chips"></div>
<div class="tools">
  <div class="muted" id="score"></div>
  <div style="display:flex;gap:6px">
    <button class="small" id="exam">20-card check</button>
    <button class="small" id="reset">Reset progress</button>
  </div>
</div>
<div class="bar"><i id="prog"></i></div>
<div class="card" id="card"></div>
<footer>Say every answer <b>out loud</b> before you reveal. Keys: <kbd>Space</kbd> reveal · <kbd>1</kbd> nailed it · <kbd>2</kbd> again · <kbd>→</kbd> skip. Progress is saved in this browser only. Built from Scott's course, the Syndicate call, Atefur #1–5, your Kevin roleplays, and the 150 calls in the repo.</footer>
</div>
<script>
const DECKS=[[["Openers", "OPEN", "They booked a 3pm slot (triage).", "(phone rings) Hello?", ["Hey Marcus, how you doing, man? It's Stefan from Ray's team. I've got you down for 3 about trading. What got you booking in?"], "Heeey… is this Marcus? Are you free for a quick 5 to 10 minute chat?", "Scott: familiar tone, context, one open question. No permission, no farming yeses.", "core"], ["Openers", "OPEN", "New form, filled out 3 minutes ago.", "Yeah, who's this?", ["Hey, it's Stefan from Ray's team. You literally just put your info in about trading. What made you fill it out?"], "So, um, like, I guess, I'm calling because you, like, filled a form?", "Speed to lead. The reason they filled it in is still fresh, so ask for it.", "core"], ["Openers", "OPEN", "Downloaded a free guide 4 days ago.", "Uh, maybe? I download a lot of stuff.", ["Ha, fair, you're not the only one. Just so I don't waste your time, is trading something you're actually looking to get into, or more just having a look around right now?"], "Oh, okay, well, can I tell you about our program?", "Scott's binary is on purpose here. It makes a cold lead pick a side.", "core"], ["Openers", "OPEN", "Old lead from 6 months ago.", "Who is this?", ["Hey, it's Stefan from Leo's team. Bit of a random one: you reached out back in May about starting a store and never got a proper call. Where are you at with it now?"], "Hi, we're following up on your interest in our services.", "Admitting it's random lowers the guard on an old lead.", "core"], ["Openers", "OPEN", "Registered for the webinar, didn't show.", "Oh no, I didn't watch it, sorry.", ["Ha, don't be sorry, half the people who sign up don't make it. What happened Tuesday?"], "Okay, well, you missed a lot of valuable information.", "Take the guilt away. 'What happened?' is an easy question, and it's often where the pain is.", "core"], ["Openers", "OPEN", "He calls back a missed call.", "Somebody called me from this number?", ["Hey, yeah, that was me, thanks for calling back. It's Stefan from Ray Thompson's team, the trading guy. You filled out an application yesterday. Ring a bell?"], "Who's this?", "Callbacks start confused. Give your name, the owner's full name, what they filled out and when.", "core"], ["Openers", "OPEN", "Paying member of the $99/month academy.", "Hey, yeah, who's this?", ["Hey Sam, it's Stefan from Luke's team. You joined the Academy about three weeks ago, so I'm doing your welcome call. How are you finding it so far?"], "Hi! I'm calling to tell you about our premium program.", "Onboard first. They've paid, so they trust you. Find the gap before any upgrade.", "core"], ["Vague", "CURRENT", "Intent question just asked.", "I just want to make more money.", ["Sure. What are you making right now, roughly?", "…And how much would you need for this to be worth it? … What would that actually change for you?"], "Why do you want more money? … But why? … Okay, but why though?", "Scott: change the angle, don't repeat 'why'. Current income, then target, then what it changes.", "core"], ["Vague", "CURRENT", "After asking what's going on.", "Everyone wants more money, right?", ["Not everyone's filling out forms about it at 11pm. (laugh) What's specifically going on for you?"], "Haha, yeah, true.", "Scott's 'not everyone' move, done lightly.", "core"], ["Vague", "CURRENT", "Trading offer. You asked how the job is.", "It's boring. Repetitive.", ["Honestly, trading's repetitive too. Same charts every morning, a lot of days nothing happens. So knowing that, why do you actually want to change?"], "How so? … How come? … Any examples?", "Scott's reframe takes 'boring' away. Now it has to be money, freedom or something real.", "core"], ["Vague", "CURRENT", "You asked what's going on at work.", "It's fine.", ["(two seconds of silence)", "…Fine?"], "Okay, cool. So what's your goal?", "Silence gets more than another question. Repeat their one word as a question (Atefur).", "core"], ["Vague", "GOAL", "You asked about their goal.", "I don't know.", ["If you had to guess?"], "Would it be more like freedom, or more like money, or…?", "Don't hand them options (Scott). Let them guess.", "core"], ["Vague", "CURRENT", "He keeps saying freedom.", "I just want freedom.", ["Freedom from what?", "What would that look like, day to day?"], "Freedom's great! So, how long have you been looking at trading?", "Turn the vague word into something concrete.", "core"], ["Vague", "WHY NOW", "You asked what made them reach out now.", "I just saw the ad.", ["Fair. And how long have you felt like [their word] about the job?", "…So what's different now, compared to then?"], "Did anything happen recently?", "Don't fish for a trigger. Pin the timeframe, then ask what's different now.", "core"], ["Vague", "WHY NOW", "He said 'just now' when you asked when he decided.", "Just now, I guess.", ["When's 'just now'? … How long ago was that? … What shifted for you when you saw it?"], "Okay. So, the money side…", "Atefur #5: pin the vague 'why now' down step by step.", "core"], ["Vague", "CURRENT", "He says the job's going nowhere.", "I'm still young, I want to see the world.", ["What do you mean when you say you're still young?"], "That's great, travelling is amazing!", "Scott: follow each new word once.", "core"], ["Vague", "URGENCY", "Temp check.", "Like a 5, I guess.", ["How come only a 5?", "…Is this something you actually want to change now, or something you'll keep pushing down the road?"], "Okay, 5 is good! So let's book you in.", "6 or below: ask why, then challenge with a binary. Disqualify, or get a real number.", "core"], ["Vague", "URGENCY", "After the challenge, he still doesn't care.", "Honestly, I'm fine where I am.", ["Is that what you're willing to settle for?", "(if yes) Then honestly, I don't think booking you in makes sense. If that changes, give me a shout."], "But don't you want more for your family?!", "Scott: no boxing match. They have to want it. An interest DQ is a fine outcome.", "core"], ["Habits", "CURRENT", "They just said: 'Every video says something different, I don't know what to do.'", "(You're about to sum it up.)", ["What do you think it'd take for you to actually get there?"], "So you're more after the guidance, right?", "Your habit #1. Make them say it. You get no points for knowing it.", "core"], ["Habits", "CURRENT", "They said: 'I missed my best friend's wedding abroad.'", "…so yeah, the business can't run without me.", ["You missed your best friend's wedding. How did that feel?", "(silence)"], "Okay. And with trading you'd have that freedom, right?", "Your habit #3. That was the North Star, and you walked past it (K4 19:02). Slow down.", "core"], ["Habits", "CURRENT", "You want to know how they feel about the job.", "(You're about to ask.)", ["How do you feel about the job?", "(stop and wait)"], "Do you like it? Do you hate it?", "Your habit #2. No options in discovery. Ask, then stop.", "core"], ["Habits", "MONEY", "Kevin asks: 'So how much does the mentorship cost?'", "How much does it usually cost?", ["Honestly, it depends on what you need, and I don't know that yet. That's exactly what Jack's call is for. He'll go through all of it."], "Anywhere from three to seven grand.", "Your habit #5 (K6 26:53). Never quote a price on a setting call.", "core"], ["Habits", "OPEN", "You're about to ask your first question.", "(Say it clean.)", ["What got you interested in e-com in the first place?"], "So tell me, man, like, what, I guess, like, have you interested in starting to, wanting to do e-com?", "Your habit #7 (K8 18:07). Five questions, learned by heart, no 'like, I guess'.", "core"], ["Pushback", "OPEN", "First 10 seconds.", "Is this a scam? No offence.", ["None taken, honestly, that's a smart question. There's a lot of fake stuff out there. I'm not selling you anything on this call, I'm just seeing if it even makes sense for you. If it doesn't, I'll tell you straight."], "No no no, we're totally legit, we have hundreds of testimonials!", "Agree with the worry. Defending yourself makes you sound less legit.", "core"], ["Pushback", "OPEN", "First 10 seconds.", "Is this a real person? Are you a bot?", ["(laugh) Last I checked. Real guy, at a desk, with a coffee that's gone cold."], "Yes, I am a real person calling on behalf of…", "Answer with a joke and a human detail.", "core"], ["Pushback", "CURRENT", "Mid-call.", "Wait, are you reading off a script?", ["I've got notes, I'm not gonna lie, everybody does. But I'm not reading you a script. I'm actually trying to understand what's going on with you before I put you in front of someone."], "No, no, of course not!", "Honesty beats denial. Then give the reason for the questions.", "core"], ["Pushback", "OPEN", "They can't understand you.", "Sorry, I can't understand you. Where are you from?", ["(relaxed) Moldova. Next to Romania. Little country, good wine. I'll slow down, my bad. So you put an application in last night. What made you apply?"], "I'm so sorry, my English is not very good, I apologise…", "One fun fact, slow down, straight back to the question. Most of the time it's their signal.", "core"], ["Pushback", "OPEN", "First minute.", "Before anything, how much is it?", ["Straight to it, I respect that. Honestly, it depends on what you need, and I don't know that yet. That's what this call's for. If it's clearly not a fit, I'll tell you in five minutes."], "It's $5,000.", "Answer honestly, give the reason, box the time, give an exit.", "core"], ["Pushback", "CURRENT", "Second time.", "Okay but seriously, is it hundreds or thousands?", ["I can tell this is really bugging you. It's an investment, it's not a fifty-dollar course. But I don't want to throw a number at you with no context. Two more minutes, and if it's clearly not realistic, I'll say."], "Like I said, it depends.", "Name their frustration. Give a little. Box the time.", "core"], ["Pushback", "MONEY", "You asked what they make.", "Why do you need to know that?", ["Fair question. It's so I know what's realistic for you. Your goal's 2 grand a month, and I want to understand the gap from where you're at now."], "(long pause) Uh… it's just, um, part of the process.", "Give the reason, calm and short. No stutter (Atefur).", "core"], ["Pushback", "MONEY", "Second, harder pushback on money.", "That's not really your business, no offence.", ["None taken, I get it. I'm not asking for the sake of it. If you go to a personal trainer to gain muscle, the first thing he asks is what you're working with. In trading it takes money to make money. Just a rough figure. What are you taking home?"], "Okay, sorry, we can skip it.", "Don't back down, don't get defensive. Reason line, then ask again, smaller.", "core"], ["Pushback", "CURRENT", "He says he doesn't need help.", "I could build all of this myself in a weekend.", ["I believe you, you're probably more technical than most people who download it. So what had you downloading it, if you could build it?"], "Well, actually, our program has a lot more than that…", "Agree, then ask a question he can only answer with his real reason.", "core"], ["Pushback", "CURRENT", "He says he already knows how to sell.", "I've sold cars for ten years. What would you even teach me?", ["Honestly? Probably not how to sell. Ten years on a lot is harder than most of what we do. So if you already know how to sell, what made you book?"], "Well, high-ticket is different from cars…", "Give status, then flip it into his reason.", "core"], ["Pushback", "CURRENT", "Already joined something else.", "I already joined another guy's program.", ["Nice, good for you for jumping in. How's it going, five months in?"], "Oh. Well, ours is better because…", "Never trash another program. Curiosity lets them tell you the gap.", "core"], ["Pushback", "CURRENT", "Tech sales offer.", "Why would I pay to get a job? Jobs should pay me.", ["Totally fair, and some people do get in free. Can I ask: since you started applying, how many interviews have the free applications got you?"], "Because our program is an investment in your future.", "Let their own numbers answer the objection.", "core"], ["Pushback", "CURRENT", "They want info, not a call.", "Can you just email me the info?", ["For sure. Honestly though, info without knowing where you're at is just a brochure. Give me five minutes and I'll know if it's even worth sending. If not, I'll tell you."], "Sure, what's your email? (and the call ends)", "Agree, then give a reason, a time box and an exit.", "core"], ["Pushback", "MONEY", "Credit repair.", "Can you guarantee I'll be at 700?", ["Straight up: no. Nobody honest can guarantee a score. If someone does, I'd run. What I can do is get you someone who'll tell you honestly what's possible and how long."], "Most of our clients see big increases!", "A guarantee is a red flag, and it's legally risky. Honesty is how you pass the test.", "core"], ["Pushback", "CURRENT", "He asks about YOU.", "How much do you make? Have you even done this?", ["(laugh) Straight in. Enough that I'm not looking for another job. And honestly, I'm still early. The guys who've been doing this a couple of years make a lot more than me, and the closers more again."], "I make six figures.", "Don't brag, don't lie. You'll get respect for being honest.", "core"], ["Money", "MONEY", "Capital offer (trading). After urgency.", "(Start the money section.)", ["Okay, let me ask a couple of questions on the money side, so I know where you're at. What are we looking to make from trading a year from now? … And how far are we from that right now, with your current income?"], "So how much money do you have?", "Set it up, then the gap (Atefur #4).", "core"], ["Money", "MONEY", "Capital offer. Monthly savings.", "(Ask how much they can save.)", ["And you know how expenses are nowadays, the way the economy's going. How much are you actually able to put aside from that each month? … Is that a tight month, or your usual?"], "How much do you save?", "'Because' psychology: a reason before the question makes people answer.", "core"], ["Money", "MONEY", "Capital offer. Total saved, and they ask why.", "Why does that matter?", ["Yeah man, I'm sure you know in trading it takes money to make money, right? So how much would you say you've set aside in terms of capital?"], "Um, sorry, it's just a question we ask.", "Your script line. Say it like it's normal, because it is.", "core"], ["Money", "MONEY", "Program offer (high-ticket sales). No capital needed.", "(Start money without saying 'capital'.)", ["A big part of what we do is help people grow their income. If this worked, what would you want to be making a month? … And where are you at right now? … With how expensive everything is, how much are you able to put aside each month? … And in total?"], "It takes money to make money in sales, right?", "For program offers, go through income. 'Capital' sounds weird when there's no business to fund.", "core"], ["Money", "MONEY", "Program offer. Checking they can invest, without saying a price.", "(Ask if they can invest.)", ["And if [closer] finds the right fit for you, is investing in yourself something you'd be in a position to do right now, or is money genuinely tight?"], "Would you be willing to invest $5,000?", "Binary on purpose: it's a challenge. No price.", "core"], ["Money", "MONEY", "Health or dating offer.", "(Ask about money.)", ["What are you spending on the gym, supplements, all of that right now? … And what's coming in each month, roughly? … Are you able to put anything aside?"], "How much do you have saved for coaching?", "Start with what they already spend.", "core"], ["Money", "SOFT QUAL", "Student or unemployed, early in the call.", "I'm at uni. I don't really work.", ["Just so I don't waste your time, if you're looking at our coaching, it's a mid four-figure investment. Is that something that'd be viable for you right now, or is it completely out of the question?"], "Okay, so what are your goals?", "Scott's transparent line. A fast DQ, or a fast green light.", "core"], ["Money", "MONEY", "He offers his retirement money.", "I've got $400K in my 401(k), money's not a problem.", ["Frank, I appreciate you being open. But I'm going to stop you there, because I'd say this to my own dad: retirement money stays retirement money. You're 59. If anything went wrong, there's no time to rebuild it."], "Great! That's more than enough.", "Right, legally safer, and the biggest trust moment on the call.", "core"], ["Money", "MONEY", "Asking about credit.", "(Ask about credit.)", ["Some people prefer to spread things out rather than paying all at once. Have you got credit available, or would you rather keep it to savings?"], "(nervous) So, um, sorry, do you maybe have, like, credit cards?", "Atefur: don't ask it 'like a cute girl at the bar'. Fewer words, no pause.", "core"], ["Tension", "OPEN", "Old lead, angry.", "Y'all keep calling me! This is the fifth one this week!", ["Five in a week, I'd be pissed too. I'm only from Ray's team. If you want me to take you off right now, I'll do it, no problem."], "Sir, I'm just doing my job.", "Agree with the anger. Offer the exit and mean it.", "core"], ["Tension", "OPEN", "He calls back, rude.", "Who the f*** is this?", ["(calm) Hey, my bad, man. It's Stefan from Sam's team. You filled out a form yesterday about the shop's Instagram. I tried you once this morning. If now's bad, I'll leave you alone."], "Excuse me, there's no need for that language.", "Stay calm, give the context, offer to go. He'll apologise himself.", "core"], ["Tension", "CURRENT", "Her husband grabs the phone.", "Is this one of those pyramid schemes?", ["Great question, and honestly, I'm glad you're here. No, nobody recruits anybody. But don't just take my word for it. That's what the next call is for, and I'd want you on it."], "Sir, I was speaking with your wife.", "Welcome the sceptical spouse. Give him a role.", "core"], ["Tension", "CURRENT", "A couple starts arguing on speaker.", "That's for the boiler and the car—", ["Can I jump in for a sec? Honestly, you're both right. Something needs to change, and you can't risk money you need. Both are true. You don't have to solve it tonight. That's what the next call is for."], "(staying quiet and letting them argue)", "Never pick a side. Hand it to the closer.", "core"], ["Tension", "CURRENT", "She starts crying.", "Sorry, I didn't think I'd get upset.", ["(gently) Please don't apologize. Take your time. There's no rush at all."], "Oh, don't cry! It's going to be okay! So, anyway…", "Say less, not more. Let her come back.", "core"], ["Tension", "CURRENT", "Their energy is flat.", "(short, bored answers)", ["Sounds like I caught you at a busy one. You still good for five minutes, or should I call you after?"], "Are you always this excited, by the way?", "Kevin #7 29:36. Name it kindly, never sarcastically.", "core"], ["Tension", "CURRENT", "He argues for free YouTube.", "I'll just use free videos.", ["That's fair, there's a lot of good free stuff. So what's stopped the free stuff from working so far?"], "Do you think everyone watching free YouTube is a millionaire?", "Kevin #7 30:26. Don't argue. Ask.", "core"], ["Tension", "CURRENT", "He takes over the call with his own questions.", "What's your success rate? Timeline? Do you run the ads? Do I need my own products?", ["I love it, you've got a list. Can I make a suggestion? Every one of those, the coach can answer with real numbers. My job is to see in ten minutes if that call's worth your time. So let me ask a few, then I'll make sure all of yours get answered. Deal?"], "Okay, um, so, our success rate is…", "Trade with the yapper. Take the frame back.", "core"], ["Tension", "WHY NOW", "He lied about a no-show.", "I was on the Zoom, nobody showed up!", ["Oh okay. Did it say 'waiting for host', or did it just not load?"], "No you weren't, Kev was there for 15 minutes.", "Give a soft way to correct the lie. Don't call it out.", "core"], ["Booking", "BOOK", "Discovery's done.", "(Pitch the call.)", ["So from what you said: [situation], [impact in their words], [goal + what it means], and what you said you need is [roadblock in their words]. That's exactly what [owner]'s team helps with. Next step's a Zoom with [closer], one of our head coaches. He'll look at [their specific thing] and map out a plan. Does tomorrow afternoon work, or is Thursday better?"], "Cool, so I'll connect you with Jack, he'll get more in depth and build a roadmap.", "Scott: recap in their words, bridge, value, two times. Generic pitches get no-shows.", "core"], ["Booking", "LOCK", "Booked.", "(Lock it in.)", ["Sent. Can you check your email real quick and hit accept for me? … Anything that could come up and clash? … And if your [wife/husband] is part of the decision, they should be on it too."], "Great, see you then!", "Accept on the call, clash check, partner on the call. That's how you lift show rate.", "core"], ["Booking", "LOCK", "Spouse decides the money.", "I'd have to talk to my wife.", ["That makes total sense. Then honestly, she should be on the call with you, so she hears it straight and can ask her own questions, instead of you explaining it after. Would that work?"], "Okay, talk to her and call me back.", "Get the decision maker on the call. Never 'call me back'.", "core"], ["Booking", "BOOK", "Tight on money, nervous.", "It's tight, but I'd want to hear what it is.", ["That's fair. The next call will be honest about whether it's the right time. If it isn't, the coach will say so, and that's okay."], "Don't worry, there are payment plans!", "Honesty is what gets tight-money prospects to show up.", "core"], ["Booking", "LOCK", "Double no-show.", "My bad, man. I know. Twice.", ["Do you actually want to do this? If not, totally fine, I'll take you off. … Okay. Accept it now while we're on the phone, set an alarm for 15 minutes before, and if you get nervous, text me before, not after. Deal?"], "Please don't miss it this time.", "Make the yes real ng", "LOCK", "Same-day booking, very hot lead.", "Could I talk to someone today?", ["Let me check. Kev's got 4:30 or 6 today. Which one?"], "Earliest I can do is next Thursday.", "Speed wins on hot leads. Book same day if you can."], ["DQ", "SOFT QUAL", "Lives in a country the offer doesn't serve.", "I'm in India. Is that okay?", ["Thanks for asking. Honestly, I need to check, because the program's set up for [region]. Let me find out properly so I don't waste your time."], "Sure, it works everywhere!", "Never guess on fit. Check."], ["DQ", "CURRENT", "Wants guaranteed returns.", "If you can't guarantee I'll make money, I'm not interested.", ["Then I'll be honest: nobody legit can guarantee you'll make money trading. If someone does, run. If a guarantee's the only way you'd do it, this probably isn't for you, and that's okay."], "You will make money if you follow the system.", "Some people disqualify themselves. Let them."], ["DQ", "CURRENT", "He's clearly in a cult-like hype mindset.", "I'm gonna be a millionaire in six months, bro, I just need the secret.", ["(laugh) Love the energy. I'll be honest, there's no secret, and six months to a million isn't realistic for basically anyone. Do you still want it if it's a few years of real work?", "(if no) Then it's probably not for you right now."], "Absolutely, our students hit that all the time.", "Unrealistic expectations become refunds."], ["DQ", "CURRENT", "Wants it for someone else who isn't interested.", "I want this for my son. He doesn't really want to do it, though.", ["That's really kind of you. Honestly, though, if he's not into it, it won't work. It's a lot of work, and he has to want it. Would he want to talk to me himself?"], "Well, you can sign him up anyway.", "The person doing the work has to want it."], ["Interview", "INTERVIEW", "Hiring manager, first question.", "Tell me about yourself.", ["I'm Stefan, from Moldova, based in Europe. For the last [X] weeks I've trained full-time to set, with [number] recorded roleplays, all reviewed and scored, coached by Scott Clancy inside Jordan Davidson's Just Do Sales. I'm looking for an offer where I can dial hard and book qualified calls."], "Well, I was born in Moldova, and when I was younger…", "20 to 40 seconds. Treat it like a sales pitch, not a CV (Scott)."], ["Interview", "INTERVIEW", "Hiring manager.", "You don't have experience. Why should we hire you?", ["Fair. What I do have is [number] reviewed roleplays and a scorecard I run on every call. When I found I was going in circles, I fixed it with my coach in two weeks. Give me your script and two weeks, and judge me on the numbers."], "I'm a fast learner and very passionate.", "Every applicant says 'passionate'. Proof beats adjectives."], ["Interview", "INTERVIEW", "Hiring manager.", "Your English, will US prospects understand you?", ["I've had that on calls. (smile) Most of the time it's their signal. When someone asks where I'm from, I tell them, make a joke about Moldovan wine, and we keep going. If anything, it makes me listen harder."], "I'm working on my English, sorry.", "Turn it into a strength, calmly."], ["Interview", "INTERVIEW", "Hiring manager.", "What's the job of a setter?", ["Book qualified calls, and protect the closer's calendar from the ones that aren't. Get the prospect to say their situation, impact, goal and roadblock in their own words, so the closer has everything before the call."], "To book as many calls as possible.", "The protect-the-calendar line shows you think like a manager (Scott)."], ["Interview", "INTERVIEW", "Hiring manager.", "Walk me through how you'd qualify financially.", ["After urgency, never before. Capital offers: goal, current income, monthly savings, tight or usual, total, and 'takes money to make money' if they push. Program offers: through income or what they spend, then 'is investing in yourself something you'd be in a position to do?'. Students and the unemployed get the transparent line early."], "I just ask how much they have.", "Show you know two different money paths."], ["Interview", "INTERVIEW", "Hiring manager.", "When would you disqualify someone?", ["Fit: under 18, or outside the market. Financial: they'd hurt themselves to pay. Interest: a temp check of 5 or below with no reason, or 'happy, just clicked the ad'. And I tell them kindly and give them something free."], "I never disqualify, every lead is an opportunity.", "Managers love setters who protect show rates."], ["Interview", "INTERVIEW", "Live roleplay test. The manager plays a happy prospect.", "Honestly, I'm good. I like my job. Just curious.", ["(after testing it properly) Then I'll be straight with you: I don't think booking you in makes sense right now. You're happy, there's no rush. If that changes, give me a shout."], "(forcing a booking to look good)", "A clean DQ in the interview impresses more than a forced booking."], ["Interview", "INTERVIEW", "End of the interview.", "Any questions for us?", ["Yes, a few. How many new leads come in per day, and how many conversations does a setter usually have? What's the show rate right now? How are commissions paid? And why did the last setter leave?"], "No, I think you covered everything.", "Vet the offer. Good offers answer with numbers."], ["Interview", "INTERVIEW", "Hiring manager.", "What would you do on your first day?", ["Watch the owner's content until I sound like them, read every script and objection doc, listen to the closer's best calls, shadow the top setter's dials, then dial."], "Start calling leads straight away.", "Prep first, then volume."], ["Interview", "INTERVIEW", "Hiring manager.", "Why do you want to set for us specifically?", ["[One specific thing about their offer or content]. I want to set for something I can stand behind, and this is that. And your leads are [niche], which is exactly what I've been practising."], "I just need a job right now.", "Tie it to their offer (Scott)."], ["Interview", "INTERVIEW", "He asks about the long term.", "Where do you see yourself in a year?", ["Being your top setter. Numbers first. If there's a path to closing later, great, but I'd earn it from that seat."], "Closing. Setting is just a stepping stone.", "Atefur: don't say you want to leave the seat."], ["On the offer", "DAY 1", "Your manager hands you the script.", "Here's the script. Start dialling in an hour.", ["Got it. Can I listen to two of the top setter's calls first, and read the objection doc? I want to sound like the owner from my first dial."], "(dial cold with no prep)", "Ten minutes of prep beats an hour of bad dials."], ["On the offer", "DAY 1", "A lead says a phrase from the owner's content.", "Like Ray says, 'risk first, profits second', right?", ["Exactly, risk first. (laugh) Sounds like you've been watching for a while. What's been your favourite video?"], "Who said that?", "Know the owner's catchphrases cold."], ["On the offer", "CLOSER", "The closer messages you.", "That last lead had no money. Why'd you book him?", ["You're right, my bad. I took 'I've got some saved' without getting a number. From now on I'll get a rough figure on every booking and put it in the note."], "He said he had money, it's not my fault.", "Own it, fix it, and say what you'll change."], ["On the offer", "CLOSER", "The closer asks what he should know.", "Anything I should know about Thursday's 6pm?", ["Yeah. Wife's on the call and she's sceptical, he got burnt by a crypto group. His line was 'I don't want to be in this truck at 40'. Temp check 9, held back by fear of losing it again. Four K saved, three of it is emergency money."], "He seemed keen!", "A great closer note is half the close."], ["On the offer", "MANAGER", "Your numbers are low after week one.", "Your bookings are low. What's going on?", ["Here's my week: [dials], [conversations], [bookings]. My conversation-to-booking rate is the problem, so it's my discovery or my pitch. Can you review two of my calls this week?"], "The leads are bad.", "Bring numbers and a hypothesis, not excuses."], ["On the offer", "MANAGER", "A lead complains about you.", "A lead said you were pushy. What happened?", ["I'll pull the recording and listen. If I was, I'll fix it. Can we look at it together for five minutes?"], "I wasn't pushy, he was just difficult.", "Coachable beats defensive."], ["On the offer", "SELF", "You blank mid-call and forget his name.", "(you've forgotten his name)", ["(check the CRM) …So, Marcus, you were saying…", "(if you can't see it) Sorry, remind me how you like to be called?"], "Hey… buddy… so…", "Keep the CRM open on screen."], ["On the offer", "SELF", "You realise you said the wrong closer's name.", "Wait, I thought you said Jack?", ["My bad, I mixed it up. It's Kev. He's one of Ray's head coaches. I'll send the invite so you've got it in writing."], "(ignore it and hope)", "Fix it on the spot, in writing."], ["On the offer", "SELF", "Your fifth rejection in a row, and you're about to dial.", "(your mood is low)", ["(stand up, deep breath, read your opener out loud once, smile, dial)"], "(dial with a flat, defeated tone)", "Every call is a new prospect. They can hear your mood."], ["On the offer", "SELF", "Your manager says to call 30 old leads today.", "(old lead list)", ["(use the old-lead opener) This is a bit of a random one. You reached out back in [month] about [X] and never got a proper call. Where are you at with it now?"], "Hi, this is a follow-up on your inquiry from 6 months ago.", "Admitting it's random lowers the guard on an old lead."], ["You", "OPEN", "You start tensing up because a US prospect talks fast.", "(fast American accent, slang you didn't catch)", ["Sorry, say that one more time? I want to make sure I get it right."], "(pretending you understood, then asking an irrelevant question)", "Asking again is fine. Faking it isn't."], ["You", "OPEN", "He mocks your accent.", "Where are you calling from, Russia? (laughs)", ["(laugh) Close, Moldova. Next door to Romania. Way better wine than Russia, I promise. So, what got you looking at trading?"], "No, Moldova is not Russia, it's a separate country.", "Don't get offended. Laugh, correct it lightly, and get back to the call."], ["You", "CURRENT", "You notice you're about to say 'like, I guess'.", "(you're about to ask what he does for work)", ["What do you do for work at the moment?"], "So, like, I guess, what would you say you do, like, work-wise?", "Your habit #7. Five questions, by heart, said clean."], ["You", "CURRENT", "You're about to label his roadblock.", "(he said: YouTube's all over the place)", ["What do you think it'd take for you to actually get there?"], "So you're more after the guidance, right?", "Your habit #1. Make him say it."], ["You", "CURRENT", "He drops a heavy line casually.", "My dad didn't recognise me last week. Dementia. Anyway.", ["(pause) Your dad didn't recognise you. … How has that been for you?"], "Sorry to hear that. So, anyway, what's your goal with trading?", "Your habit #3. Catch it, slow down, two follow-ups."], ["You", "MONEY", "You're nervous about the credit question.", "(it's time to ask about credit)", ["And in terms of credit, where are you at?", "(then stop talking)"], "(pause) So, um, sorry, I just have to ask, do you, like, maybe have any credit cards?", "Atefur: not 'like a cute girl at the bar'. Fewer words, no apology."], ["You", "BOOK", "You're about to pitch generically.", "(discovery's done)", ["So from what you said, [their situation and impact, their words], you want [goal + meaning], and what you said you need is [roadblock, their words]. Next step's a Zoom with [closer]. He'll [specific value]. Tomorrow at 6, or Thursday?"], "So yeah, I'll connect you with Jack, he'll help you build a roadmap.", "Your habit #6. A recap in their words beats a generic pitch."], ["You", "URGENCY", "You're about to skip the temp check because he seems keen.", "(he's been positive the whole call)", ["On a scale of 1 to 10, how important is it for you to [goal]? … What makes it a [number]? … What's holding it back from a 10?"], "(go straight to booking)", "Your habit #9. Keen isn't the same as committed. The answer to 'what's holding it back' is the closer's gold."], ["You", "CURRENT", "He's comfortable, likes his job, just saw an ad.", "My job's chill honestly. Flexible hours. I just saw the ad.", ["(test it) What would need to change for this to really matter to you?", "(if nothing) Then honestly, booking you in doesn't make sense right now. Give me a shout if that changes."], "Okay! And how much do you have set aside to invest?", "Your habit #10 (K8). Not everyone should be booked."], ["You", "CURRENT", "You want to say he could do it on his own anyway.", "I'll just use free videos.", ["That's fair. So what's stopped the free stuff from working so far?"], "Do you think everyone watching free YouTube is a millionaire?", "Kevin #7. Ask, don't argue."]]];
const DNAME=["Check 1 · Core","Check 2 · The 150 calls","Check 3 · New scenarios"];
const DSUB=["The original deck: Scott, Atefur, your habits","One card from every roleplay in GitHub","Situations not in any call yet"];
const D=[];DECKS.forEach((deck,di)=>deck.forEach((c,ci)=>D.push({id:"d"+(di+1)+"-"+ci,deck:di,cat:c[0],stage:c[1],ctx:c[2],line:c[3],good:c[4],dont:c[5],why:c[6],src:c[7]||"new"})));
let deck=-1,cat="All",order=[],i=0,shown=false,exam=null;
let S={};try{S=JSON.parse(localStorage.getItem("drills2")||"{}")}catch(e){S={}}
const save=()=>{try{localStorage.setItem("drills2",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const inDeck=c=>deck<0||c.deck===deck;
const pool=()=>D.filter(c=>inDeck(c)&&(cat==="All"||c.cat===cat));
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function decks(){
  const tabs=[{k:-1,n:"Mix all",s:D.length+" cards, everything"}].concat(DNAME.map((n,k)=>({k,n,s:DECKS[k].length+" cards · "+DSUB[k]})));
  $("decks").innerHTML=tabs.map(t=>`<button class="tab${t.k===deck?" on":""}" data-k="${t.k}"><b>${t.n}</b><span>${t.s}</span></button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{deck=+b.dataset.k;cat="All";exam=null;decks();chips();build()});
}
function chips(){
  const cats=["All",...new Set(D.filter(inDeck).map(c=>c.cat))];
  $("chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;exam=null;chips();build()});
}
function build(){const p=pool();order=shuffle(p.map(c=>c.id)).sort((a,b)=>(S[a]||0)-(S[b]||0));if(exam){order=shuffle(p.map(c=>c.id)).slice(0,20);exam={ok:0,miss:[],n:order.length}}i=0;render()}
function stats(){
  const p=pool();const done=p.filter(c=>(S[c.id]||0)>=2).length;
  $("count").textContent=`${p.length} cards · ${deck<0?"all checks":DNAME[deck]}${cat==="All"?"":" · "+cat}`;
  $("score").textContent=exam?`20-card check: ${i}/${exam.n} · ${exam.ok} nailed`:`${done} of ${p.length} nailed twice or more`;
  $("prog").style.width=(exam?Math.round(i/exam.n*100):(p.length?Math.round(done/p.length*100):0))+"%";
  $("exam").classList.toggle("on",!!exam);$("exam").textContent=exam?"Stop check":"20-card check";
}
function cardById(id){return D.find(c=>c.id===id)}
function render(){
  stats();
  if(exam&&i>=exam.n){return result()}
  if(!order.length){$("card").innerHTML="<p>No cards here.</p>";return}
  const c=cardById(order[i%order.length]);shown=false;
  $("card").innerHTML=`<div class="meta"><div class="stage">${esc(c.stage)} · ${esc(c.cat)}</div><div class="src">${esc(c.src==="core"?"Check 1":c.src==="new"?"Check 3 · new":"Check 2 · "+c.src)}</div></div>
  <div class="ctx">${esc(c.ctx)}</div><div class="line">“${esc(c.line)}”</div>
  <div class="say">Say your answer <b>out loud</b> before you reveal.</div>
  <div class="ans" id="ans"><h3>Say something like</h3>${c.good.map(x=>"<p>"+esc(x)+"</p>").join("")}<h3 class="no">Not this</h3><p>${esc(c.dont)}</p><p class="why">${esc(c.why)}</p></div>
  <div class="btns" id="btns"><button class="b p" id="rev">Reveal</button><button class="b" id="skip">Skip →</button></div>`;
  $("rev").onclick=reveal;$("skip").onclick=()=>{if(exam){exam.miss.push(c.id)}next()};
}
function reveal(){if(shown)return;shown=true;$("ans").className="ans show";$("btns").innerHTML=`<button class="b g" id="ok">Nailed it</button><button class="b r" id="again">Again</button>`;$("ok").onclick=()=>mark(1);$("again").onclick=()=>mark(-1)}
function mark(v){const id=order[i%order.length];S[id]=Math.max(0,(S[id]||0)+v);save();if(exam){if(v>0)exam.ok++;else exam.miss.push(id)}else if(v<0){order.splice(Math.min(order.length,i+4),0,id)}next()}
function next(){i++;render()}
function result(){
  const pct=Math.round(exam.ok/exam.n*100);
  const verdict=pct>=85?"Ready for live calls on this set.":pct>=65?"Close. Drill the misses below, then run another check.":"Not yet. Go back to practice mode on this set.";
  $("card").innerHTML=`<div class="result"><h2>${exam.ok} / ${exam.n} · ${pct}%</h2><p>${verdict}</p>${exam.miss.length?"<p class='muted'>Missed:</p><ul>"+exam.miss.map(id=>{const c=cardById(id);return "<li><b>“"+esc(c.line)+"”</b><br><span class='muted'>"+esc(c.good[0])+"</span></li>"}).join("")+"</ul>":"<p>No misses.</p>"}
  <div class="btns"><button class="b p" id="again2">Run another check</button><button class="b" id="back">Back to practice</button></div></div>`;
  $("again2").onclick=()=>{exam={};build()};$("back").onclick=()=>{exam=null;build()};
}
$("exam").onclick=()=>{exam=exam?null:{};build()};
$("reset").onclick=()=>{if(confirm("Reset all saved progress on this device?")){S={};save();build()}};
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key===" "){e.preventDefault();reveal()}else if(e.key==="1"&&shown)mark(1);else if(e.key==="2"&&shown)mark(-1);else if(e.key==="ArrowRight"&&!shown)next()});
$("theme").onclick=()=>{const r=document.documentElement;const cur=r.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",dark?"light":"dark")};
decks();chips();build();
</script>
